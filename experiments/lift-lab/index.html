<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lift Lab</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../matte.css?v=16">
  <link rel="stylesheet" href="../../drift-wall.css">
  <style>
    /* Lift Lab: tune how a screen is picked up off a drift wall (data-focus in drift-wall.js). Hovering a screen raises
       it off the wall; pressing it lifts it out, turns it to face the viewer and fills the frame with it. The stage is
       Mazlan Builder's wall from the work page, built by the same script, so the real thing is what moves; the faders
       are its settings (FOCUS in drift-wall.js). A saved version marked "on the site" is what the work page uses.
       Saving needs the local server (dvs). */
    body { margin: 0; min-height: 100vh; background: var(--c-night); color: var(--c-mist); font: 400 var(--step-0)/1.5 var(--font-sans); }
    .lab { display: grid; grid-template-columns: minmax(0, 1fr) 372px; min-height: 100vh; }
    .stage { position: sticky; top: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; min-width: 0; }
    .stage__head { display: flex; align-items: baseline; gap: 20px; padding: 20px 28px; }
    .stage__head h1 { margin: 0; font: 600 var(--step-1)/1 var(--font-display); letter-spacing: -0.01em; }
    /* the wall at the work page's shape, as large as the stage allows */
    .stage__well { display: grid; place-items: center; min-height: 0; padding: 0 28px; container-type: size; }
    .stage__well .wall { width: min(100cqw, 100cqh * 16 / 11); border-radius: var(--radius-sm); }
    .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 20px 28px; }
    .side { display: flex; flex-direction: column; gap: 16px; padding: 20px; background: #08090b; border-left: 1px solid rgb(255 255 255 / 0.06); overflow-y: auto; max-height: 100vh; box-sizing: border-box; }
    .side .m-panel { display: flex; }
    .side .m-panel[hidden] { display: none; }
    .side .m-seg { display: flex; }
    .side .m-seg button { flex: 1; }
    .group { display: grid; gap: 14px; justify-items: stretch; }
    .group h2 { margin: 0; }
    .row { display: grid; grid-template-columns: 1fr 68px; align-items: center; gap: 4px 10px; }
    /* each part has its own place, so the row doesn't shuffle when Reset comes and goes */
    .row label { grid-area: 1 / 1; align-self: end; }
    .row .m-fader { grid-area: 2 / 1; width: 100%; }
    /* every fader has a number field beside it: type a value in place of dragging */
    .matte .row__num { grid-area: 2 / 2; width: 100%; height: 24px; padding: 0 6px; text-align: right; font-size: var(--step--1); font-variant-numeric: tabular-nums; }
    /* a fader moved off the value it was loaded with gets a Reset beside its name, which puts it back */
    .matte .row__reset { grid-area: 1 / 2; justify-self: end; align-self: end; height: 16px; margin-right: -5px; padding: 0 5px; border-radius: 3px; color: var(--m-signal); font: 400 var(--step--2)/16px var(--m-font); letter-spacing: 0.1em; text-transform: uppercase; }
    .matte .row__reset:hover { color: var(--m-print-hi); background: color-mix(in srgb, var(--m-print) 12%, transparent); }
    .matte .row__reset[hidden] { display: none; }
    .row.is-changed .row__num { color: var(--m-signal); }
    .saved { display: grid; gap: 10px; }
    .saved__row { display: flex; gap: 8px; align-items: center; }
    .saved__row .m-input { flex: 1; min-width: 0; }
    #status { min-height: 1.4em; }
    /* the easing curve, drawn: time runs left to right (200 units), progress bottom to top (100 units, with room for a handle to go from -1 to 2) */
    .curve { display: block; width: 100%; height: 180px; border-radius: 4px; background: var(--m-well); overflow: visible; touch-action: none; }
    .curve path { fill: none; stroke: var(--m-signal); stroke-width: 1.5; }
    .curve line { stroke: rgb(255 255 255 / 0.1); stroke-width: 1; }
    /* the curve's two handles, dragged on the graph: a tether back to the end each one steers, a dot, and a larger unseen disc to catch the pointer */
    .curve .tether { stroke: rgb(255 255 255 / 0.45); }
    .curve .grip { cursor: grab; }
    .curve .grip__hit { fill: transparent; }
    .curve .grip__dot { fill: var(--m-well); stroke: #fff; stroke-width: 1.5; transition: fill 120ms ease-out; }
    .curve .grip:hover .grip__dot, .curve .grip.is-held .grip__dot { fill: var(--m-signal); }
    .curve .grip.is-held { cursor: grabbing; }
    @media (max-width: 900px) { .lab { grid-template-columns: 1fr; } .stage { position: static; height: 78vh; } .side { max-height: none; border-left: 0; } }
  </style>
</head>
<body class="matte matte--dark">
  <div class="lab">
    <section class="stage" aria-label="Preview">
      <header class="stage__head">
        <a class="m-legend" href="../../work.html">← Work</a>
        <h1>Lift Lab</h1>
        <span class="m-legend m-legend--dim">Hover a screen, then press it</span>
      </header>
      <div class="stage__well">
        <!-- Mazlan Builder's wall, as on the work page -->
        <figure class="bay__media" id="wall" data-wall="../../images/mazlan-wall/" data-count="21" data-clips="all" data-tilt="56" data-turn="40" data-focus data-hd
                data-label="A drifting wall of screens from Mazlan Builder">
          <img src="../../images/mazlan-builder-1200.webp" width="1200" height="753" alt="">
        </figure>
      </div>
      <footer class="transport">
        <button class="m-key m-key--lg m-key--primary" id="lift" type="button">Pick up a screen</button>
        <span class="m-legend m-legend--dim">Slow motion</span>
        <button class="m-switch" id="slow" type="button" role="switch" aria-checked="false" aria-label="Slow motion, a quarter speed"></button>
      </footer>
    </section>

    <aside class="side" aria-label="Settings">
      <div class="m-panel m-panel--col m-panel--flat"><div class="m-cell group saved">
        <h2 class="m-legend m-legend--lg">Saved versions</h2>
        <select class="m-input" id="versions" aria-label="Saved version"></select>
        <div class="saved__row">
          <button class="m-key" id="use" type="button">Use on the site</button>
          <button class="m-key" id="remove" type="button">Delete</button>
        </div>
        <div class="saved__row">
          <input class="m-input" id="name" type="text" placeholder="Name for a new version" aria-label="Name for a new version">
          <button class="m-key" id="save" type="button">Save</button>
        </div>
        <button class="m-key m-key--quiet" id="reset" type="button">Reset the faders to the original</button>
        <p class="m-legend m-legend--dim" id="status" role="status"></p>
      </div></div>
      <div class="m-panel m-panel--col m-panel--flat"><div class="m-cell group">
        <h2 class="m-legend m-legend--lg">The way up</h2>
        <div class="m-seg" id="motion" role="radiogroup" aria-label="The way up">
          <button type="button" role="radio" aria-checked="true" data-motion="two">Two moves</button>
          <button type="button" role="radio" aria-checked="false" data-motion="one">One move</button>
        </div>
      </div></div>
      <div id="groups"></div>
    </aside>
  </div>

  <script src="../../filings-versions.js"></script>
  <script src="../../filings.js"></script>
  <script src="../../matte.js?v=8"></script>
  <script src="../../wall-focus-versions.js?t=1"></script>
  <script src="../../drift-wall.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    Matte.init();
    // The settings and their starting values: the same list as FOCUS in drift-wall.js, before any saved version is laid
    // over it. A version stores only what differs from these.
    const DEFAULTS = { hover: 1.4, hoverMs: 200, motion: 'two', lift: 5, riseMs: 140, turnMs: 480, oneMs: 560, fill: 0.94, radius: 10, dim: 0.62, outMs: 440,
      riseX1: 0.3, riseY1: 0, riseX2: 0.2, riseY2: 1, turnX1: 0.23, turnY1: 1, turnX2: 0.32, turnY2: 1,
      oneX1: 0.23, oneY1: 1, oneX2: 0.32, oneY2: 1 };
    // [key, label, min, max, step], in groups. A group with a third entry has an easing curve, drawn from the four
    // handles whose keys start with it; one with a fourth shows only while the way up is that many moves.
    const handles = (move) => [[move + 'X1', 'First handle, across', 0, 1, 0.01], [move + 'Y1', 'First handle, up', -1, 2, 0.01],
      [move + 'X2', 'Second handle, across', 0, 1, 0.01], [move + 'Y2', 'Second handle, up', -1, 2, 0.01]];
    // lengths are shares of the wall's height: 1 is a hundredth of it
    const GROUPS = [
      ['Under the pointer', [
        ['hover', 'Rises off the wall by, % of its height', 0, 6, 0.1],
        ['hoverMs', 'Takes, ms', 0, 800, 10],
      ]],
      ['Rising off the wall', [
        ['lift', 'Rises by, % of the wall\'s height', 0, 30, 0.1],
        ['riseMs', 'Takes, ms', 0, 1500, 10],
        ...handles('rise'),
      ], 'rise', 'two'],
      ['Turning to face you', [
        ['turnMs', 'Takes, ms', 60, 2500, 10],
        ...handles('turn'),
      ], 'turn', 'two'],
      ['Rising and turning together', [
        ['oneMs', 'Takes, ms', 60, 3000, 10],
        ...handles('one'),
      ], 'one', 'one'],
      ['In the frame', [
        ['fill', 'Fills the frame to, at most', 0.4, 1, 0.01],
        ['radius', 'Corner radius, px', 0, 40, 1],
        ['dim', 'How dark the wall goes behind it', 0, 0.95, 0.01],
      ]],
      ['Putting it back', [
        ['outMs', 'The way back takes, ms', 120, 3000, 10],
      ]],
    ];
    const CURVES = GROUPS.filter((g) => g[2]).map((g) => g[2]);
    const KEYS = GROUPS.flatMap(([, rows]) => rows.map((r) => r[0]));
    let store = JSON.parse(JSON.stringify(window.WALL_FOCUS_VERSIONS || { active: 'original', versions: [{ id: 'original', name: 'Original', savedAt: null, config: {} }] }));
    let config = { ...DEFAULTS, ...(store.versions.find((v) => v.id === store.active) || {}).config };

    $('groups').innerHTML = GROUPS.map(([title, rows, curve, mode]) => `
      <div class="m-panel m-panel--col m-panel--flat"${mode ? ` data-mode="${mode}"` : ''} style="margin-bottom: 16px"><div class="m-cell group">
        <h2 class="m-legend m-legend--lg">${title}</h2>
        ${curve ? `<svg class="curve" id="curve-${curve}" viewBox="0 -100 200 300" role="img" aria-label="Its easing curve"><line x1="0" y1="100" x2="200" y2="100"/><line x1="0" y1="0" x2="200" y2="0"/><path/><line class="tether" x1="0" y1="100"/><line class="tether" x1="200" y1="0"/>${[1, 2].map((n) => `<g class="grip" data-move="${curve}" data-n="${n}"><circle class="grip__hit" r="22"/><circle class="grip__dot" r="7"/></g>`).join('')}</svg>` : ''}
        ${rows.map(([key, label, min, max, step]) => `
          <div class="row" id="r-${key}"><label class="m-legend m-legend--dim" for="f-${key}">${label}</label>
            <button class="row__reset" id="x-${key}" type="button" hidden aria-label="Reset ${label.replace(/, (px|ms|% .*)$/, '')}">Reset</button>
            <input class="m-fader" type="range" id="f-${key}" min="${min}" max="${max}" step="${step}">
            <input class="m-input row__num" type="number" id="o-${key}" min="${min}" max="${max}" step="${step}" aria-label="${label}, typed"></div>`).join('')}
      </div></div>`).join('');

    // ---- the wall ----
    const wall = $('wall');
    let slow = false;
    // slow motion stretches every time by four, on the stage only: what is saved is the faders' values
    const staged = () => slow ? { ...config, hoverMs: config.hoverMs * 4, riseMs: config.riseMs * 4, turnMs: config.turnMs * 4, oneMs: config.oneMs * 4, outMs: config.outMs * 4 } : config;
    function push() {
      for (const m of CURVES) {
        const svg = $('curve-' + m);
        svg.querySelector('path').setAttribute('d', `M0 100 C${config[m + 'X1'] * 200} ${100 - config[m + 'Y1'] * 100} ${config[m + 'X2'] * 200} ${100 - config[m + 'Y2'] * 100} 200 0`);
        svg.querySelectorAll('.grip').forEach((g, i) => {
          const x = config[m + 'X' + (i + 1)] * 200, y = 100 - config[m + 'Y' + (i + 1)] * 100;
          g.setAttribute('transform', `translate(${x} ${y})`);
          const tether = svg.querySelectorAll('.tether')[i];
          tether.setAttribute('x2', x); tether.setAttribute('y2', y);
        });
      }
      if (window.DriftWall) DriftWall.apply(staged());
    }
    // base is what the faders were last loaded with or saved as: a fader off its base value shows its Reset
    let base = { ...config };
    function mark(k) {
      const off = config[k] !== base[k];
      $('x-' + k).hidden = !off;
      $('x-' + k).title = off ? `Back to ${base[k]}` : '';
      $('r-' + k).classList.toggle('is-changed', off);
    }
    // a fader and its number field show the same value; put(k, v) sets it from either, or from a Reset
    const RANGE = Object.fromEntries(GROUPS.flatMap(([, rows]) => rows.map(([key, , min, max]) => [key, [min, max]])));
    function put(k, v, from) {
      config[k] = v;
      if (from !== 'fader') $('f-' + k).value = v;
      if (from !== 'number') $('o-' + k).value = v;
      mark(k);
    }
    // the way up: two moves or one. The switch shows its groups and hides the other's.
    function moves() {
      document.querySelectorAll('#motion [role="radio"]').forEach((b) => { b.setAttribute('aria-checked', String(b.dataset.motion === config.motion)); b.tabIndex = b.dataset.motion === config.motion ? 0 : -1; });
      document.querySelectorAll('[data-mode]').forEach((g) => { g.hidden = g.dataset.mode !== config.motion; });
    }
    $('motion').addEventListener('change', () => { config.motion = $('motion').querySelector('[aria-checked="true"]').dataset.motion; moves(); push(); });
    function show() { for (const k of KEYS) put(k, config[k]); moves(); push(); }
    const rebase = () => { base = { ...config }; show(); };
    for (const k of KEYS) {
      $('f-' + k).addEventListener('input', (e) => { put(k, Number(e.target.value), 'fader'); push(); });
      // typed: a number inside the fader's range takes effect as it is typed; leaving the field (or Enter) tidies it,
      // bringing anything outside the range to its nearest end and an empty field back to the current value
      $('o-' + k).addEventListener('input', (e) => {
        const v = e.target.valueAsNumber;
        if (Number.isFinite(v) && v >= RANGE[k][0] && v <= RANGE[k][1]) { put(k, v, 'number'); push(); }
      });
      $('o-' + k).addEventListener('change', (e) => {
        const v = e.target.valueAsNumber;
        put(k, Number.isFinite(v) ? Math.min(RANGE[k][1], Math.max(RANGE[k][0], v)) : config[k]); push();
      });
      $('x-' + k).addEventListener('click', () => { put(k, base[k]); push(); $('f-' + k).focus(); });
    }

    // The handles on the graphs: drag one and its two faders follow. The graph is time across and progress up, so a
    // handle's place is its across and up values; both are held to the faders' ranges and rounded to their step.
    document.querySelectorAll('.grip').forEach((grip) => {
      const svg = grip.ownerSVGElement, kx = grip.dataset.move + 'X' + grip.dataset.n, ky = grip.dataset.move + 'Y' + grip.dataset.n;
      const hold = (k, v) => Math.round(Math.min(RANGE[k][1], Math.max(RANGE[k][0], v)) * 100) / 100;
      let off = null;   // where on the handle it was caught, so it doesn't jump to the pointer
      const at = (e) => new DOMPoint(e.clientX, e.clientY).matrixTransform(svg.getScreenCTM().inverse());
      grip.addEventListener('pointerdown', (e) => {
        if (e.button) return;
        e.preventDefault();
        const p = at(e);
        off = { x: p.x - config[kx] * 200, y: p.y - (100 - config[ky] * 100) };
        grip.setPointerCapture(e.pointerId);
        grip.classList.add('is-held');
      });
      grip.addEventListener('pointermove', (e) => {
        if (!off) return;
        const p = at(e);
        put(kx, hold(kx, (p.x - off.x) / 200)); put(ky, hold(ky, (100 - (p.y - off.y)) / 100)); push();
      });
      const drop = () => { off = null; grip.classList.remove('is-held'); };
      grip.addEventListener('pointerup', drop);
      grip.addEventListener('pointercancel', drop);
    });

    // the transport: pick up the screen nearest the middle, or put the one held back; the key follows the wall
    const label = () => { $('lift').textContent = wall.wallLift && wall.wallLift.held() ? 'Put it back' : 'Pick up a screen'; };
    $('lift').addEventListener('click', () => {
      if (!wall.wallLift) return;
      if (wall.wallLift.held()) wall.wallLift.close(); else wall.wallLift.open();
      label();
    });
    wall.addEventListener('click', () => setTimeout(label));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') setTimeout(label); });
    // the switch flips itself (matte.js); read it once it has
    $('slow').addEventListener('click', () => setTimeout(() => { slow = $('slow').getAttribute('aria-checked') === 'true'; push(); }));
    show();

    // ---- saved versions: kept in wall-focus-versions.js, written by the local server ----
    const say = (text) => { $('status').textContent = text; };
    const changed = (c) => Object.fromEntries(['motion', ...KEYS].filter((k) => c[k] !== DEFAULTS[k]).map((k) => [k, c[k]]));   // a version stores only what differs
    function list(selected) {
      $('versions').innerHTML = store.versions.map((v) => `<option value="${v.id}">${v.name.replace(/[<&]/g, '')}${v.id === store.active ? ' · on the site' : ''}</option>`).join('');
      $('versions').value = selected || store.active;
    }
    async function write(message) {
      try {
        const res = await fetch('/__lab/lift', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(store) });
        say(res.ok ? message : `Not saved: ${await res.text()}`);
        return res.ok;
      } catch (err) { say('Not saved: this only works on the local server (dvs).'); return false; }
    }
    $('versions').addEventListener('change', () => {
      const v = store.versions.find((x) => x.id === $('versions').value);
      config = { ...DEFAULTS, ...v.config }; rebase(); say(`Loaded “${v.name}”.`);
    });
    $('save').addEventListener('click', async () => {
      const name = $('name').value.trim() || `Version ${store.versions.length}`;
      const at = store.versions.find((v) => v.name === name && v.id !== 'original');   // the same name overwrites
      const v = at || { id: Date.now().toString(36), name };
      v.savedAt = new Date().toISOString(); v.config = changed(config);
      if (!at) store.versions.push(v);
      list(v.id); $('name').value = ''; rebase();
      await write(`Saved “${name}”. Press “Use on the site” to make it the one the work page uses.`);
    });
    $('use').addEventListener('click', async () => {
      store.active = $('versions').value; list(store.active);
      await write(`The work page now uses “${store.versions.find((v) => v.id === store.active).name}”.`);
    });
    $('remove').addEventListener('click', async () => {
      const id = $('versions').value;
      if (id === 'original') return say('The original stays.');
      if (id === store.active) return say('That version is on the site. Put another on the site first.');
      store.versions = store.versions.filter((v) => v.id !== id); list();
      await write('Deleted.');
    });
    $('reset').addEventListener('click', () => { config = { ...DEFAULTS }; show(); say('Faders reset. Nothing is saved until you press Save.'); });
    list();
  </script>
</body>
</html>
