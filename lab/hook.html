<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hook prototype (throwaway)</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="../styles.css">
  <style>
    /* THROWAWAY PROTOTYPE of the front-page hook. Sand on a vibrating plate fills the page,
       the pattern drifts from one figure to the next, and the sentence arrives over it. */
    html, body { height: 100%; margin: 0; overflow: hidden; background: var(--c-night); }
    #plate { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
    .hook { position: fixed; inset: 0; display: grid; align-content: center; justify-items: center; text-align: center;
      padding: 0 max(24px, 8vw); pointer-events: none; }
    .hook__text { margin: 0; max-width: 19em; text-wrap: balance; font: 600 clamp(26px, 3.5vw, 54px)/1.14 var(--font-display);
      letter-spacing: -.005em; color: var(--c-mist); }
    .hook__name { display: block; margin-bottom: .35em; color: var(--c-ochre); }
    .word { display: inline-block; opacity: 0; transform: translateY(.18em); filter: blur(6px); }
    .is-in .word { animation: word 520ms cubic-bezier(0.23, 1, 0.32, 1) forwards; animation-delay: calc(var(--i) * 70ms); }
    @keyframes word { to { opacity: 1; transform: none; filter: none; } }
    .hook__cta { margin-top: 44px; display: inline-flex; align-items: center; gap: .6em; pointer-events: auto;
      font: 400 14px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; text-decoration: none;
      color: var(--c-mist); border: 1px solid var(--c-mist); border-radius: 999px; padding: 15px 22px;
      opacity: 0; transform: translateY(8px); transition: opacity 600ms ease, transform 600ms cubic-bezier(0.23, 1, 0.32, 1), background 150ms, color 150ms; }
    .is-done .hook__cta { opacity: 1; transform: none; }
    .hook__cta:hover, .hook__cta:focus-visible { background: var(--c-mist); color: var(--c-night); }
    @media (prefers-reduced-motion: reduce) {
      .word { opacity: 1; transform: none; filter: none; animation: none !important; }
      .hook__cta { opacity: 1; transform: none; transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="plate" aria-hidden="true"></canvas>
  <main class="hook">
    <div class="hook__inner">
      <h1 class="hook__text"><span class="hook__name">I’m Brian.</span> I design human-in-the-loop agentic systems for high-stakes, regulated industries.</h1>
      <a class="hook__cta" href="../index.html">Recent Work <span aria-hidden="true">→</span></a>
    </div>
  </main>

  <script>
  (() => {
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    // ---- the sentence: split into words so they can arrive one at a time -------------------
    const hook = document.querySelector('.hook'), inner = document.querySelector('.hook__inner');
    let wi = 0;
    const split = (node) => {
      [...node.childNodes].forEach((c) => {
        if (c.nodeType === 3) {
          const frag = document.createDocumentFragment();
          c.textContent.split(/(\s+)/).forEach((t) => {
            if (!t) return;
            if (/^\s+$/.test(t)) { frag.append(' '); return; }
            const s = document.createElement('span');
            s.className = 'word'; s.style.setProperty('--i', wi++); s.textContent = t;
            frag.append(s);
          });
          c.replaceWith(frag);
        } else if (c.nodeType === 1) { split(c); if (c.classList.contains('hook__name')) wi += 5; }   // a beat after the name
      });
    };
    split(document.querySelector('.hook__text'));
    const TEXT_AT = reduced ? 0 : 1900;                       // let the sand find its first figure
    setTimeout(() => hook.classList.add('is-in'), TEXT_AT);
    setTimeout(() => hook.classList.add('is-done'), TEXT_AT + wi * 70 + 500);

    // ---- the plate -------------------------------------------------------------------------
    const canvas = document.getElementById('plate');
    const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
    if (!gl) return;

    // Chladni figures: cos(nπu)cos(mπv) ± cos(mπu)cos(nπv) on a square plate as wide as the
    // page's longer side. The page shows the middle band of it.
    const FIGURES = [[5, 8, -1], [4, 7, 1], [6, 9, 1], [3, 8, -1], [7, 10, 1], [5, 11, -1], [8, 10, 1], [4, 11, 1], [6, 12, -1], [7, 9, -1]];
    const CYCLE = 4.8;                                       // seconds from one figure to the next                             // seconds
    const CELL = 4;                                           // field grid, in CSS px

    let W, H, dpr, S, gw, gh, U, FX, FY, tabs;
    let N = 0, pos, vel, off, ovel, shown, seedBuf, posBuf;   // pos: where a grain lies on the plate; off: how far the cursor or a pulse has knocked it
    let rect = [0, 0, 0, 0];

    function measure() {
      const r = inner.getBoundingClientRect();
      rect = [r.left, r.top, r.right, r.bottom];
    }

    function resize() {
      const oldW = W, oldH = H;
      W = innerWidth; H = innerHeight; dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      gl.viewport(0, 0, canvas.width, canvas.height);
      S = Math.max(W, H) / 2;
      gw = Math.ceil(W / CELL) + 1; gh = Math.ceil(H / CELL) + 1;
      U = new Float32Array(gw * gh); FX = new Float32Array(gw * gh); FY = new Float32Array(gw * gh);
      tabs = {};
      const want = Math.max(18000, Math.min(120000, Math.round(W * H / 11)));
      if (!N || want > N * 1.4 || want < N / 1.4) seedGrains(want);
      else if (oldW) for (let i = 0; i < N; i++) { pos[2 * i] *= W / oldW; pos[2 * i + 1] *= H / oldH; }   // keep the figure through a resize
      measure();
    }

    function seedGrains(n) {
      N = n;
      pos = new Float32Array(N * 2); vel = new Float32Array(N * 2);
      off = new Float32Array(N * 2); ovel = new Float32Array(N * 2); shown = new Float32Array(N * 2);
      const seeds = new Float32Array(N);
      for (let i = 0; i < N; i++) { pos[2 * i] = Math.random() * W; pos[2 * i + 1] = Math.random() * H; seeds[i] = Math.random(); }
      gl.bindBuffer(gl.ARRAY_BUFFER, seedBuf); gl.bufferData(gl.ARRAY_BUFFER, seeds, gl.STATIC_DRAW);
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW);
    }

    // cos(kπu) along x and along y, cached per k
    function tab(k) {
      if (tabs[k]) return tabs[k];
      const x = new Float32Array(gw), y = new Float32Array(gh);
      for (let i = 0; i < gw; i++) x[i] = Math.cos(k * Math.PI * ((i * CELL - W / 2) / S + 1) / 2);
      for (let j = 0; j < gh; j++) y[j] = Math.cos(k * Math.PI * ((j * CELL - H / 2) / S + 1) / 2);
      return (tabs[k] = { x, y });
    }

    // The field is a blend of two figures; sand is pushed down the slope of its square.
    function field(a, b, w) {
      const an = tab(a[0]), am = tab(a[1]), bn = tab(b[0]), bm = tab(b[1]);
      const wa = 1 - w, wb = w, sa = a[2], sb = b[2];
      for (let j = 0; j < gh; j++) {
        const any = an.y[j], amy = am.y[j], bny = bn.y[j], bmy = bm.y[j], o = j * gw;
        for (let i = 0; i < gw; i++) {
          U[o + i] = wa * (an.x[i] * amy + sa * am.x[i] * any) + wb * (bn.x[i] * bmy + sb * bm.x[i] * bny);
        }
      }
      const k = 1 / (2 * CELL);
      for (let j = 0; j < gh; j++) {
        const jm = Math.max(0, j - 1) * gw, jp = Math.min(gh - 1, j + 1) * gw, o = j * gw;
        for (let i = 0; i < gw; i++) {
          const u = U[o + i];
          FX[o + i] = u * (U[o + Math.min(gw - 1, i + 1)] - U[o + Math.max(0, i - 1)]) * k;
          FY[o + i] = u * (U[jp + i] - U[jm + i]) * k;
        }
      }
    }

    // ---- cursor and pulses -----------------------------------------------------------------
    const mouse = { x: 0, y: 0, on: false };
    const pulses = [];
    addEventListener('pointermove', (e) => { if (e.pointerType === 'mouse') { mouse.x = e.clientX; mouse.y = e.clientY; mouse.on = true; } });
    document.documentElement.addEventListener('pointerleave', () => { mouse.on = false; });
    addEventListener('pointerdown', (e) => {
      if (e.target.closest('a')) return;
      pulses.push({ x: e.clientX, y: e.clientY, t: performance.now() });
      if (pulses.length > 4) pulses.shift();
    });

    // ---- sand ------------------------------------------------------------------------------
    const REST = 0.11, DAMP = 0.86, HEAL = 0.004, PULSE = 2.9, MOUSE_R = 130, PULSE_SPEED = 1100, PULSE_BAND = 90;
    function step(k, now) {
      const K = 0.07 * S, inv = 1 / CELL, R2 = MOUSE_R * MOUSE_R;
      const far = Math.hypot(W, H);
      const live = [];
      for (const p of pulses) {
        const r = (now - p.t) / 1000 * PULSE_SPEED;
        if (r < far) live.push(p.x, p.y, r, PULSE * Math.max(0, 1 - r / far) ** 1.5);
      }
      const damp = Math.pow(DAMP, k);
      for (let p = 0; p < N; p++) {
        const ix = 2 * p, iy = ix + 1;
        let x = pos[ix], y = pos[iy];
        let ci = (x * inv + 0.5) | 0, cj = (y * inv + 0.5) | 0;
        if (ci < 0) ci = 0; else if (ci >= gw) ci = gw - 1;
        if (cj < 0) cj = 0; else if (cj >= gh) cj = gh - 1;
        const c = cj * gw + ci;
        let u = U[c]; if (u < 0) u = -u; if (u > 1) u = 1;
        // where the plate is nearly still, friction wins: the sand rests in a band, not a hairline
        let grip = (u - REST * 0.4) / REST; grip = grip < 0 ? 0 : grip > 1 ? 1 : grip;
        let ax = -FX[c] * K * grip, ay = -FY[c] * K * grip;
        if (ax > 1.4) ax = 1.4; else if (ax < -1.4) ax = -1.4;
        if (ay > 1.4) ay = 1.4; else if (ay < -1.4) ay = -1.4;

        // the cursor and pulses knock grains aside from where they lie; a soft spring brings them back
        let ox = off[ix], oy = off[iy], px = 0, py = 0;
        const sx = x + ox, sy = y + oy;
        if (mouse.on) {
          const dx = sx - mouse.x, dy = sy - mouse.y, d2 = dx * dx + dy * dy;
          if (d2 < R2 && d2 > 0.01) {
            const d = Math.sqrt(d2), f = 1 - d / MOUSE_R, g = f * f * 3.2 / d;
            px += dx * g; py += dy * g;
          }
        }
        for (let q = 0; q < live.length; q += 4) {
          const dx = sx - live[q], dy = sy - live[q + 1], d = Math.sqrt(dx * dx + dy * dy) + 0.001;
          const s = (d - live[q + 2]) / PULSE_BAND;
          if (s > -1 && s < 1) { const g = live[q + 3] * (1 - s * s) / d; px += dx * g; py += dy * g; }
        }
        if (px !== 0 || py !== 0 || ox !== 0 || oy !== 0) {
          let ovx = (ovel[ix] + (px - ox * HEAL) * k) * damp, ovy = (ovel[iy] + (py - oy * HEAL) * k) * damp;
          ox += ovx * k; oy += ovy * k;
          if (px === 0 && py === 0 && ox * ox + oy * oy < 0.04 && ovx * ovx + ovy * ovy < 0.01) ox = oy = ovx = ovy = 0;   // home
          ovel[ix] = ovx; ovel[iy] = ovy; off[ix] = ox; off[iy] = oy;
        }

        const vx = (vel[ix] + ax * k) * damp, vy = (vel[iy] + ay * k) * damp;
        vel[ix] = vx; vel[iy] = vy;
        const jit = 0.9 + 5 * u * grip;                       // grains hop where the plate moves, rest where it doesn't
        x += vx * k + (Math.random() - 0.5) * jit;
        y += vy * k + (Math.random() - 0.5) * jit;
        if (x < -6) x = -6; else if (x > W + 6) x = W + 6;
        if (y < -6) y = -6; else if (y > H + 6) y = H + 6;
        pos[ix] = x; pos[iy] = y;
        shown[ix] = x + ox; shown[iy] = y + oy;
      }
    }

    // ---- drawing ---------------------------------------------------------------------------
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, `
      attribute vec2 aPos; attribute float aSeed;
      uniform vec2 uRes; uniform float uDpr, uDim; uniform vec4 uRect;
      varying float vA, vSeed;
      void main() {
        gl_Position = vec4(aPos.x / uRes.x * 2.0 - 1.0, 1.0 - aPos.y / uRes.y * 2.0, 0.0, 1.0);
        gl_PointSize = (1.2 + 1.3 * fract(aSeed * 7.13)) * uDpr;
        // the sand goes quiet behind the sentence
        float d = max(max(uRect.x - aPos.x, aPos.x - uRect.z), max(uRect.y - aPos.y, aPos.y - uRect.w));
        vA = mix(1.0 - 0.93 * uDim, 1.0, smoothstep(-10.0, 100.0, d));
        vSeed = aSeed;
      }`));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, `
      precision mediump float;
      varying float vA, vSeed;
      void main() {
        vec2 c = gl_PointCoord - 0.5;
        float a = smoothstep(0.25, 0.12, dot(c, c)) * vA * (0.55 + 0.45 * vSeed);
        vec3 sand = vec3(0.78, 0.718, 0.6), mist = vec3(0.855, 0.894, 0.89), ochre = vec3(0.875, 0.753, 0.424);
        vec3 col = mix(sand, mist, fract(vSeed * 3.7));
        col = mix(col, ochre, step(0.9, fract(vSeed * 11.3)));
        gl_FragColor = vec4(col * a, a);
      }`));
    gl.linkProgram(prog); gl.useProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error('hook: shader', gl.getProgramInfoLog(prog), gl.getAttachedShaders(prog).map((s) => gl.getShaderInfoLog(s)).join('|'));
    const loc = (n) => gl.getUniformLocation(prog, n);
    seedBuf = gl.createBuffer(); posBuf = gl.createBuffer();
    const aPos = gl.getAttribLocation(prog, 'aPos'), aSeed = gl.getAttribLocation(prog, 'aSeed');
    gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.clearColor(4 / 255, 10 / 255, 19 / 255, 1);

    resize();
    addEventListener('resize', resize);
    document.fonts && document.fonts.ready.then(measure);

    const smooth = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const START = Math.floor(Math.random() * FIGURES.length);   // a different first figure each visit
    function setField(t) {                                    // t: seconds since the page opened
      // never still: the blend crawls as a figure comes together, then runs towards the next one
      const idx = reduced ? 0 : Math.floor(t / CYCLE), ph = reduced ? 0 : t / CYCLE - idx;
      const a = FIGURES[(START + idx) % FIGURES.length], b = FIGURES[(START + idx + 1) % FIGURES.length];
      field(a, b, smooth(smooth(ph)));
    }
    // ?ff=12 runs the first 12 seconds before the first frame (for screenshots); &pulse=x,y,age adds a click
    const q = new URLSearchParams(location.search), FF = (parseFloat(q.get('ff')) || 0) * 1000;
    let t0 = performance.now() - FF;
    if (FF) {
      hook.classList.add('is-in', 'is-done');
      document.querySelectorAll('.word').forEach((w) => { w.style.animationDelay = '0s'; w.style.animationDuration = '1ms'; });
      document.querySelector('.hook__cta').style.transition = 'none';
      const pq = (q.get('pulse') || '').split(',').map(Number);
      if (pq.length === 3) pulses.push({ x: pq[0], y: pq[1], t: t0 + FF - pq[2] * 1000 });
      const mq = (q.get('mouse') || '').split(',').map(Number);
      if (mq.length === 2) { mouse.x = mq[0]; mouse.y = mq[1]; mouse.on = true; }
      for (let ms = 0; ms < FF; ms += 16.667) { setField(ms / 1000); step(1, t0 + ms); }
    }
    let last = performance.now();
    function frame(now) {
      const k = Math.max(0.2, Math.min(2.5, (now - last) / 16.667)); last = now;
      setField(Math.max(0, now - t0) / 1000);
      step(k, now);

      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferSubData(gl.ARRAY_BUFFER, 0, shown);
      gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, seedBuf);
      gl.enableVertexAttribArray(aSeed); gl.vertexAttribPointer(aSeed, 1, gl.FLOAT, false, 0, 0);
      gl.uniform2f(loc('uRes'), W, H); gl.uniform1f(loc('uDpr'), dpr);
      gl.uniform4f(loc('uRect'), rect[0], rect[1], rect[2], rect[3]);
      gl.uniform1f(loc('uDim'), Math.max(0, Math.min(1, (now - t0 - TEXT_AT + 300) / 900)));
      gl.drawArrays(gl.POINTS, 0, N);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
