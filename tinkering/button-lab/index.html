<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button Lab · Brian Studwell</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../../styles.css">
  <script src="../../button-versions.js"></script>
  <script src="../../buttons.js"></script>
  <style>
    :root { color-scheme: dark; --accent: #bdbdbd; --panel-w: 340px; }
    html, body { height: 100%; overflow: hidden; }
    body {
      display: grid;
      grid-template: "head panel" 56px "stage panel" minmax(0, 1fr) / minmax(0, 1fr) var(--panel-w);
      font-size: 13px;
      line-height: 1.4;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    select { padding: 4px 6px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }

    /* Header */
    .head { grid-area: head; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--line); }
    .head > a { color: var(--muted); transition: color 0.15s; }
    .head > a:hover { color: var(--fg); }
    .head h1 { font-size: 15px; font-weight: 600; margin-right: auto; }
    .head label { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .seg { display: flex; padding: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
    .seg button { padding: 3px 10px; border-radius: 4px; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: #2a2a2c; color: var(--fg); }

    /* Stage: the nav as it appears on the site, in both themes, plus each state held still */
    .stage { grid-area: stage; overflow: auto; min-width: 0; }
    .strip { padding: 28px 0 32px; background: var(--ground); color: var(--fg); }
    .strip + .strip { border-top: 1px solid var(--line); }
    .strip__label { padding: 0 24px 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.6; }
    .strip__body { zoom: var(--zoom, 1); }
    .nav.lab-nav {
      position: relative;
      z-index: auto;
      height: auto;
      min-height: 0;
      padding: 12px 24px;
      flex-wrap: wrap;
      row-gap: 12px;
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    /* .nav only so the site's chip rules apply; none of the header styling */
    .nav.states {
      position: static;
      height: auto;
      min-height: 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      align-items: flex-start;
      gap: 24px;
      padding: 20px 24px 0;
      background: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    .states figure { display: grid; justify-items: start; gap: 8px; }
    .states figcaption { font-size: 12px; opacity: 0.6; }
    .hint { padding: 16px 24px 24px; color: var(--muted); font-size: 12px; }

    /* Parameter panel */
    .panel { grid-area: panel; display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--surface); }
    .panel__top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    .panel__count { flex: 1; color: var(--muted); }
    .panel__list { flex: 1; overflow-y: auto; padding: 0 16px 24px; }
    .btn { padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; white-space: nowrap; transition: border-color 0.15s; }
    .btn:hover { border-color: var(--muted); }

    .group h2 { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; padding: 16px 0 8px; background: var(--surface); font-size: 12px; font-weight: 600; color: var(--muted); }
    .group h2 .btn { padding: 1px 8px; font-weight: 400; }
    .row { display: grid; grid-template-columns: 1fr auto 20px; align-items: center; gap: 2px 6px; padding: 7px 0; }
    .row__name { font-weight: 500; }
    .row__value { display: flex; align-items: center; gap: 4px; color: var(--muted); }
    .row__value input[type="number"] { width: 64px; padding: 2px 4px; text-align: right; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); }
    .row__value input[type="checkbox"] { accent-color: var(--accent); }
    .row__value input[type="color"] { width: 32px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; }
    .row__value input[type="text"] { width: 72px; padding: 2px 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; color: var(--fg); font-family: var(--font-mono); font-size: 12px; }
    .row__reset { width: 20px; height: 20px; border-radius: 4px; color: var(--muted); visibility: hidden; }
    .row__reset:hover { color: var(--fg); background: #222222; }
    .row.is-changed .row__reset { visibility: visible; }
    .row.is-changed .row__name { color: var(--accent); }
    .row input[type="range"] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
    .row__hint { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }

    /* Shadow stack */
    .shadow { margin: 4px 0 10px; padding: 8px 10px 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
    .shadow__top { display: flex; align-items: center; gap: 6px; padding-bottom: 4px; }
    .shadow__title { flex: 1; font-weight: 600; white-space: nowrap; }
    .shadow__top select { padding: 2px 4px; font-size: 12px; }
    .shadow__inset { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; }
    .shadow__inset input { accent-color: var(--accent); }
    .shadow__icon { visibility: visible; }
    .shadow__icon:disabled { opacity: 0.3; cursor: default; }
    .row--compact { padding: 4px 0; }
    .group h2.is-changed { color: var(--accent); }

    /* Versions */
    .save { display: flex; gap: 6px; }
    .save input { flex: 1; min-width: 0; padding: 5px 7px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
    .version-use { display: block; width: 100%; margin-top: 8px; border-color: var(--accent); color: var(--accent); }
    .version-use:hover { border-color: var(--accent); }
    .version-use:disabled { border-color: var(--line); color: var(--muted); }
    .versions { list-style: none; margin-top: 8px; }
    .version { display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .version__name { min-width: 0; font-weight: 500; overflow-wrap: anywhere; }
    .version__date { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .version__actions { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; }
    .version__actions .btn { padding: 2px 9px; font-size: 12px; }
    .version__badge { padding: 2px 9px; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: 12px; font-weight: 600; }
    .version__delete { margin-left: auto; color: var(--muted); font-size: 12px; }
    .version__delete:hover { color: var(--fg); }
    #version-status { display: block; margin-top: 8px; }

    @media (max-width: 900px) {
      html, body { height: auto; overflow: auto; }
      body { display: block; }
      .head { flex-wrap: wrap; height: auto; padding: 12px 16px; }
      .stage { overflow: visible; }
      .panel { border-left: 0; border-top: 1px solid var(--line); }
      .panel__list { overflow: visible; }
    }
  </style>
</head>
<body>
  <header class="head">
    <a href="../../work.html">← Site</a>
    <h1>Button Lab</h1>
    <label>Backdrop
      <select id="backdrop" aria-label="Backdrop behind the buttons"></select>
    </label>
    <div class="seg" id="zoom" role="group" aria-label="Zoom">
      <button type="button" data-zoom="1" aria-pressed="true">1×</button>
      <button type="button" data-zoom="2" aria-pressed="false">2×</button>
      <button type="button" data-zoom="3" aria-pressed="false">3×</button>
    </div>
  </header>

  <main class="stage" id="stage"></main>

  <aside class="panel" aria-label="Parameters">
    <div class="panel__top">
      <span class="panel__count" id="count" aria-live="polite"></span>
      <button class="btn" id="copy" type="button">Copy config</button>
      <button class="btn" id="reset" type="button">Reset</button>
    </div>
    <div class="panel__list" id="params">
      <section class="group">
        <h2>Versions</h2>
        <div id="version-tools" hidden>
          <form class="save" id="version-form">
            <input id="version-name" type="text" placeholder="Name this version" aria-label="Version name" autocomplete="off">
            <button class="btn" id="version-save" type="submit">Save</button>
          </form>
          <button class="btn version-use" id="version-use" type="button">Use on site</button>
        </div>
        <ul class="versions" id="version-list"></ul>
        <small class="row__hint" id="version-status" aria-live="polite"></small>
      </section>
    </div>
  </aside>

  <template id="strip">
    <section class="strip">
      <div class="strip__label"></div>
      <div class="strip__body">
        <div class="nav lab-nav">
          <div class="nav__start">
            <button class="dropdown__toggle chip" type="button"><svg class="chip__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 8h4"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M17 16h4"/><path d="M19 12V3"/><path d="M19 21v-5"/><path d="M3 14h4"/><path d="M5 10V3"/><path d="M5 21v-7"/></svg>Controls</button>
            <a class="chip" href="#"><svg class="chip__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 12h.01"/><path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><path d="M22 13a18.15 18.15 0 0 1-20 0"/><rect width="20" height="14" x="2" y="6" rx="2"/></svg>Work</a>
            <a class="chip" href="#">Brian for Agents<svg class="chip__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg></a>
          </div>
          <div class="nav__links">
            <a class="chip" href="#" aria-current="page"><svg class="chip__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.99 6.74 1.93 3.44"/><path d="M19.136 12a10 10 0 0 1-14.271 0"/><path d="m21 21-2.16-3.84"/><path d="m3 21 8.02-14.26"/><circle cx="12" cy="5" r="2"/></svg>Rigs and Jigs</a>
            <a class="chip" href="#"><svg class="chip__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/></svg>LinkedIn</a>
            <a class="chip" href="#"><svg class="chip__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg>Contact</a>
          </div>
        </div>
        <div class="states nav">
          <figure><a class="chip" href="#">Rest</a><figcaption>Rest</figcaption></figure>
          <figure><a class="chip is-hover" href="#">Hover</a><figcaption>Hover</figcaption></figure>
          <figure><a class="chip is-press" href="#">Pressed</a><figcaption>Pressed</figcaption></figure>
          <figure><a class="chip is-current" href="#">Current</a><figcaption>Current page / open menu</figcaption></figure>
        </div>
      </div>
    </section>
  </template>

  <script src="lab.js"></script>
  <script src="../../filings-versions.js"></script>
  <script src="../../filings.js"></script>
  <script src="experiments.js"></script>
  <script src="../../spark.js" defer></script>
</body>
</html>
