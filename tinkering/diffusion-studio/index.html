<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diffusion Studio</title>
  <meta name="description" content="A virtual studio for words seen through frosted glass, paper, fabric, ice and fog: placed behind the material, lit, and coming into focus as they touch it.">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../matte.css?v=16">
  <style>
    /* Diffusion Studio: the stage is the pane, seen from the front, with the words somewhere behind it; the panel
       beside it is the studio. Matte is the instrument; the stage is its own. */
    body { margin: 0; height: 100vh; overflow: hidden; background: var(--c-night); color: var(--c-mist); font: 400 var(--step-0)/1.5 var(--font-sans); }
    .lab { display: grid; grid-template-columns: minmax(0, 1fr) 408px; height: 100vh; }
    .stage-col { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; min-width: 0; }
    .head { display: flex; align-items: center; gap: 12px 20px; padding: 16px 24px; border-bottom: 1px solid rgb(255 255 255 / 0.06); flex-wrap: wrap; }
    .head h1 { margin: 0; font: 600 var(--step-1)/1 var(--font-display); letter-spacing: -0.01em; }
    .head__end { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .head select.m-input { width: 190px; height: 32px; }
    .stage { position: relative; min-height: 0; background: #000; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #view.is-dragging { cursor: grabbing; }
    #view:not([data-tool="move"]) { cursor: crosshair; }
    .fail { position: absolute; inset: auto 24px 24px; margin: 0; padding: 12px 14px; border-radius: 6px; background: #2a1210; color: #ffb4a8; font: 400 var(--step--1)/1.4 var(--font-mono); }
    .transport { display: flex; align-items: center; gap: 12px 16px; padding: 14px 24px; border-top: 1px solid rgb(255 255 255 / 0.06); flex-wrap: wrap; }
    .transport .m-seg { flex-wrap: wrap; }
    .view { margin-left: auto; display: flex; align-items: center; gap: 6px; }
    .view__zoom { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
    #view.is-panning { cursor: move; }
    #view[data-tool="pan"] { cursor: move; }
    #view[data-tool="orbit"] { cursor: ew-resize; }

    .side { display: flex; flex-direction: column; min-height: 0; background: #08090b; border-left: 1px solid rgb(255 255 255 / 0.06); }
    .tabs { flex-wrap: wrap; padding: 8px 8px 0; border-bottom: 1px solid rgb(255 255 255 / 0.06); }
    .matte .tabs [role="tab"] { padding-left: 9px; padding-right: 9px; }
    .tabs [role="tab"]::after { left: 9px; right: 9px; }
    .side__body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; scrollbar-width: none; }
    .side__body::-webkit-scrollbar { display: none; }
    .tabpane { display: grid; gap: 16px; }
    .tabpane[hidden] { display: none; }
    .side .m-panel { display: flex; }
    .side .m-panel[hidden] { display: none; }
    .group { display: grid; gap: 14px; justify-items: stretch; }
    .group h2 { margin: 0; }
    .row { display: grid; grid-template-columns: 1fr 68px; align-items: center; gap: 4px 10px; }
    .row[hidden] { display: none; }
    .row label, .row > .m-legend { grid-area: 1 / 1; align-self: end; }
    .row .m-fader { grid-area: 2 / 1; width: 100%; }
    .matte .row__num { grid-area: 2 / 2; width: 100%; height: 24px; padding: 0 6px; text-align: right; font-size: var(--step--1); font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; }
    .row__num::-webkit-inner-spin-button, .row__num::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .matte .row__reset { grid-area: 1 / 2; justify-self: end; align-self: end; height: 16px; margin-right: -5px; padding: 0 5px; border-radius: 3px; color: var(--m-signal); font: 400 var(--step--2)/16px var(--m-font); letter-spacing: 0.1em; text-transform: uppercase; }
    .matte .row__reset:hover { color: var(--m-print-hi); background: color-mix(in srgb, var(--m-print) 12%, transparent); }
    .matte .row__reset[hidden] { display: none; }
    .row.is-changed .row__num { color: var(--m-signal); }
    /* a select or a segmented choice: its name above, the choice across the full width */
    .row--pick { grid-template-columns: 1fr; }
    .row--pick .m-input { grid-area: 2 / 1; width: 100%; height: 32px; }
    .row--pick .m-seg { grid-area: 2 / 1; justify-self: start; }
    /* a switch or a colour: name on the left, the control at the right edge */
    .row--switch { grid-template-columns: 1fr auto; }
    .row--switch > :first-child { grid-area: 1 / 1; align-self: center; }
    .row--switch > :last-child { grid-area: 1 / 2; }
    .row--text { grid-template-columns: 1fr; }
    .row--text textarea { width: 100%; font: 400 var(--step-0)/1.4 var(--font-sans); }
    .row--custom { grid-template-columns: 1fr; }
    .swatch { width: 56px; height: 28px; padding: 0; border: 0; border-radius: 4px; background: var(--m-well); box-shadow: var(--m-well-shadow); cursor: pointer; }
    .swatch::-webkit-color-swatch-wrapper { padding: 4px; }
    .swatch::-webkit-color-swatch { border: 0; border-radius: 2px; }
    .swatch::-moz-color-swatch { border: 0; border-radius: 2px; }
    .font { display: grid; gap: 6px; }
    .font__pick { display: flex; gap: 8px; }
    .font__pick .m-input { flex: 1; min-width: 0; width: auto; height: 32px; }
    .font .m-input[hidden], .font [hidden] { display: none; }
    .font select.m-input { width: 100%; height: 32px; }
    .font label:not(:first-child) { margin-top: 8px; }
    .scenes { display: grid; grid-template-columns: 1fr 1fr; width: 100%; box-sizing: border-box; }
    .matte .scenes button { justify-content: flex-start; text-align: left; }
    @media (max-width: 900px) {
      body { height: auto; overflow: auto; }
      .lab { grid-template-columns: 1fr; height: auto; }
      .stage-col { height: 82vh; }
      .side { border-left: 0; border-top: 1px solid rgb(255 255 255 / 0.06); }
      .matte .tabs [role="tab"] { padding-left: 9px; padding-right: 9px; }
    .tabs [role="tab"]::after { left: 9px; right: 9px; }
    .side__body { overflow: visible; }
      .head { padding: 12px 16px; } .transport { padding: 12px 16px; }
      .head select.m-input { width: 150px; }
    }
  </style>
</head>
<body class="matte matte--dark">
  <div class="lab">
    <section class="stage-col" aria-label="The pane">
      <header class="head">
        <a class="m-legend" href="../">← Experiments</a>
        <h1>Diffusion Studio</h1>
        <div class="head__end">
          <select class="m-input" id="looks" aria-label="Looks"></select>
          <button class="m-key" id="play" type="button" aria-pressed="false" data-tip="Pause or play time (P)">Pause</button>
          <button class="m-key" id="snap" type="button">Save image</button>
          <button class="m-key m-key--quiet" id="reset-all" type="button">Start over</button>
        </div>
      </header>
      <div class="stage" id="stage">
        <canvas id="view" aria-label="The pane, with the words behind it. Drag to move them; scroll to zoom; Shift and scroll pushes them toward or away from the glass."></canvas>
        <p class="fail" id="fail" hidden role="alert"></p>
      </div>
      <footer class="transport">
        <div id="tools"></div>
        <div class="view" role="group" aria-label="View">
          <button class="m-key" id="zoom-out" type="button" aria-label="Zoom out" data-tip="Zoom out (−)">−</button>
          <span class="m-legend view__zoom" id="zoom" aria-live="polite">100%</span>
          <button class="m-key" id="zoom-in" type="button" aria-label="Zoom in" data-tip="Zoom in (+)">+</button>
          <button class="m-key m-key--quiet" id="fit" type="button" data-tip="Back to the whole pane, square on (0)">Fit</button>
        </div>
      </footer>
    </section>
    <aside class="side" id="panel" aria-label="Studio"></aside>
  </div>
  <script src="../../filings-versions.js"></script>
  <script src="../../filings.js"></script>
  <script src="../../matte.js?v=8"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
