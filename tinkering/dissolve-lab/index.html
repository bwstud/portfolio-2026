<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dissolve Lab</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../matte.css?v=12">
  <style>
    /* Dissolve Lab: tune how the cover's control panel dissolves when Recent Work is pressed.
       The stage is the cover itself in a frame, so the sand, the sentence, the key and the panel can be timed together;
       the faders are the exit's settings (cover/dissolve.js). A saved version marked
       "on the cover" is what the front page plays. Saving needs the local server (dvs). */
    body { margin: 0; min-height: 100vh; background: var(--c-night); color: var(--c-mist); font: 400 15px/1.5 var(--font-sans); }
    .lab { display: grid; grid-template-columns: minmax(0, 1fr) 372px; min-height: 100vh; }
    .stage { position: sticky; top: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }
    .stage__head { display: flex; align-items: baseline; gap: 20px; padding: 20px 28px; }
    .stage__head h1 { margin: 0; font: 600 22px/1 var(--font-display); letter-spacing: -0.01em; }
    .stage__cover { width: 100%; height: 100%; border: 0; display: block; background: var(--c-night); }
    .transport { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 20px 28px; }
    .transport .m-seg { margin: 0; }
    .side { display: flex; flex-direction: column; gap: 16px; padding: 20px; background: #08090b; border-left: 1px solid rgb(255 255 255 / 0.06); overflow-y: auto; max-height: 100vh; box-sizing: border-box; }
    .side .m-panel { display: flex; }
    .group { display: grid; gap: 14px; justify-items: stretch; }
    .group h2 { margin: 0; }
    .row { display: grid; grid-template-columns: 1fr 68px; align-items: center; gap: 4px 10px; }
    .row .m-legend:first-child { grid-column: 1 / -1; }
    .row .m-fader { width: 100%; }
    /* every fader has a number field beside it: type a value in place of dragging */
    .matte .row__num { width: 100%; height: 24px; padding: 0 6px; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
    .saved { display: grid; gap: 10px; }
    .saved__row { display: flex; gap: 8px; align-items: center; }
    .saved__row .m-input { flex: 1; min-width: 0; }
    #status { min-height: 1.4em; }
    @media (max-width: 900px) { .lab { grid-template-columns: 1fr; } .stage { position: static; height: 78vh; } .side { max-height: none; border-left: 0; } }
  </style>
</head>
<body class="matte matte--dark">
  <div class="lab">
    <section class="stage" aria-label="Preview">
      <header class="stage__head">
        <a class="m-legend" href="../../">← Cover</a>
        <h1>Dissolve Lab</h1>
        <span class="m-legend m-legend--dim">Space or Recent Work plays it</span>
      </header>
      <!-- the cover itself, sand and all. Press Play, or press Recent Work in it: either way it plays the faders' settings -->
      <iframe class="stage__cover" id="cover" src="../../?lab&ff=4" title="The cover"></iframe>
      <footer class="transport">
        <button class="m-key m-key--lg m-key--primary" id="play" type="button">Play</button>
        <div class="m-seg" role="radiogroup" aria-label="Speed" id="rate">
          <button type="button" role="radio" aria-checked="true" data-rate="1">Full speed</button>
          <button type="button" role="radio" aria-checked="false" data-rate="0.5">Half</button>
          <button type="button" role="radio" aria-checked="false" data-rate="0.25">Quarter</button>
          <button type="button" role="radio" aria-checked="false" data-rate="0.1">Tenth</button>
        </div>
        <span class="m-legend m-legend--dim">Loop</span>
        <button class="m-switch" id="loop" type="button" role="switch" aria-checked="false" aria-label="Loop"></button>
        <span class="m-legend m-legend--dim" id="clock"></span>
      </footer>
    </section>

    <aside class="side" aria-label="Settings">
      <div class="m-panel m-panel--col m-panel--flat"><div class="m-cell group saved">
        <h2 class="m-legend m-legend--lg">Saved versions</h2>
        <select class="m-input" id="versions" aria-label="Saved version"></select>
        <div class="saved__row">
          <button class="m-key" id="use" type="button">Use on the cover</button>
          <button class="m-key" id="remove" type="button">Delete</button>
        </div>
        <div class="saved__row">
          <input class="m-input" id="name" type="text" placeholder="Name for a new version" aria-label="Name for a new version">
          <button class="m-key" id="save" type="button">Save</button>
        </div>
        <button class="m-key m-key--quiet" id="reset" type="button">Reset the faders to the original</button>
        <p class="m-legend m-legend--dim" id="status" role="status"></p>
      </div></div>
      <div id="groups"></div>
    </aside>
  </div>

  <script src="../../filings-versions.js"></script>
  <script src="../../filings.js"></script>
  <script src="../../matte.js?v=8"></script>
  <script src="../../cover/dissolve-versions.js?t=1"></script>
  <script src="../../cover/dissolve.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    Matte.init();
    // [key, label, min, max, step], in groups. The keys are Dissolve's settings (cover/dissolve.js).
    const GROUPS = [
      ['Sentence and key', [
        ['textDelay', 'Sentence leaves at, ms', 0, 3000, 10],
        ['keyDelay', 'Key leaves at, ms', 0, 3000, 10],
        ['textOut', 'Rise and fade takes, ms', 60, 1500, 10],
        ['rise', 'Rise, px', 0, 200, 2],
      ]],
      ['Panel timing', [
        ['delay', 'Starts to crumble at, ms', 0, 3000, 10],
        ['popAt', 'Crumbles slowly for, ms', 200, 3000, 10],
        ['rush', 'The rush takes, ms', 40, 1200, 10],
        ['rushCurve', 'How the rush builds', 1, 6, 0.1],
        ['stagger', 'Bites begin over, ms', 0, 1500, 10],
        ['curve', 'How late it speeds up', 1, 8, 0.1],
        ['after', 'Tail after it has gone, ms', 100, 1000, 10],
      ]],
      ['Crumbling', [
        ['bites', 'Bites along the edge', 1, 20, 1],
        ['reach', 'Bite depth by the rush', 0.1, 2, 0.05],
        ['crumbs', 'Crumbs shed', 0, 40, 0.5],
        ['size', 'Particle size, px', 0.5, 5, 0.1],
        ['life', 'Crumb life, ms', 100, 2000, 10],
        ['drift', 'Sideways drift', 0, 200, 2],
      ]],
      ['Reverse gravity', [
        ['gravityStart', 'Pull at the start', 0, 1000, 10],
        ['gravityEnd', 'Pull from the rush on', 0, 12000, 100],
        ['gravityCurve', 'How late the pull builds', 1, 8, 0.1],
      ]],
    ];
    const KEYS = GROUPS.flatMap(([, rows]) => rows.map((r) => r[0]));
    let config = Dissolve.activeConfig();
    let store = JSON.parse(JSON.stringify(window.DISSOLVE_VERSIONS || { active: 'original', versions: [{ id: 'original', name: 'Original', savedAt: null, config: {} }] }));

    $('groups').innerHTML = GROUPS.map(([title, rows]) => `
      <div class="m-panel m-panel--col m-panel--flat" style="margin-bottom: 16px"><div class="m-cell group">
        <h2 class="m-legend m-legend--lg">${title}</h2>
        ${rows.map(([key, label, min, max, step]) => `
          <label class="row"><span class="m-legend m-legend--dim">${label}</span>
            <input class="m-fader" type="range" id="f-${key}" min="${min}" max="${max}" step="${step}">
            <input class="m-input row__num" type="number" id="o-${key}" min="${min}" max="${max}" step="${step}" aria-label="${label}, typed"></label>`).join('')}
      </div></div>`).join('');
    const RANGE = Object.fromEntries(GROUPS.flatMap(([, rows]) => rows.map(([key, , min, max]) => [key, [min, max]])));
    function show() { for (const k of KEYS) { $('f-' + k).value = config[k]; $('o-' + k).value = config[k]; } }
    for (const k of KEYS) {
      $('f-' + k).addEventListener('input', (e) => { config[k] = Number(e.target.value); $('o-' + k).value = config[k]; });
      // typed: a number inside the fader's range takes effect as it is typed; leaving the field (or Enter) tidies it,
      // bringing anything outside the range to its nearest end and an empty field back to the current value
      $('o-' + k).addEventListener('input', (e) => {
        const v = e.target.valueAsNumber;
        if (Number.isFinite(v) && v >= RANGE[k][0] && v <= RANGE[k][1]) { config[k] = v; $('f-' + k).value = v; }
      });
      $('o-' + k).addEventListener('change', (e) => {
        const v = e.target.valueAsNumber;
        if (Number.isFinite(v)) config[k] = Math.min(RANGE[k][1], Math.max(RANGE[k][0], v));
        $('f-' + k).value = config[k]; e.target.value = config[k];
      });
    }
    show();

    // ---- playing it ----
    let rate = 1, playing = false;
    const cover = () => $('cover').contentWindow.coverLab;
    window.dissolveLab = {                                           // what the cover in the frame asks for and reports
      config: () => config,
      rate: () => rate,
      done(ms) {
        $('clock').textContent = `${Math.round(ms)} ms`; playing = false;
        if ($('loop').getAttribute('aria-checked') === 'true') setTimeout(play, 1400);
      },
    };
    function play() {
      if (!cover()) return;
      playing = true; $('clock').textContent = '';
      cover().play();
    }
    $('play').addEventListener('click', play);
    $('rate').addEventListener('click', (e) => {
      const b = e.target.closest('[data-rate]'); if (!b) return;
      rate = Number(b.dataset.rate);
      $('rate').querySelectorAll('button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
    });
    $('loop').addEventListener('click', () => setTimeout(() => { if ($('loop').getAttribute('aria-checked') === 'true' && !playing) play(); }));
    addEventListener('keydown', (e) => {
      if (e.key !== ' ' || e.target.closest('input, select, button, textarea')) return;
      e.preventDefault(); play();
    });

    // ---- saved versions: kept in cover/dissolve-versions.js, written by the local server ----
    const say = (text) => { $('status').textContent = text; };
    const changed = (c) => Object.fromEntries(KEYS.filter((k) => c[k] !== Dissolve.DEFAULTS[k]).map((k) => [k, c[k]]));   // a version stores only what differs
    function list(selected) {
      $('versions').innerHTML = store.versions.map((v) => `<option value="${v.id}">${v.name.replace(/[<&]/g, '')}${v.id === store.active ? ' · on the cover' : ''}</option>`).join('');
      $('versions').value = selected || store.active;
    }
    async function write(message) {
      try {
        const res = await fetch('/__lab/dissolve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(store) });
        say(res.ok ? message : `Not saved: ${await res.text()}`);
        return res.ok;
      } catch (err) { say('Not saved: this only works on the local server (dvs).'); return false; }
    }
    $('versions').addEventListener('change', () => {
      const v = store.versions.find((x) => x.id === $('versions').value);
      config = { ...Dissolve.DEFAULTS, ...v.config }; show(); say(`Loaded “${v.name}”.`);
    });
    $('save').addEventListener('click', async () => {
      const name = $('name').value.trim() || `Version ${store.versions.length}`;
      const at = store.versions.find((v) => v.name === name && v.id !== 'original');   // the same name overwrites
      const v = at || { id: Date.now().toString(36), name };
      v.savedAt = new Date().toISOString(); v.config = changed(config);
      if (!at) store.versions.push(v);
      list(v.id); $('name').value = '';
      await write(`Saved “${name}”. Press “Use on the cover” to make it the one the cover plays.`);
    });
    $('use').addEventListener('click', async () => {
      store.active = $('versions').value; list(store.active);
      await write(`The cover now plays “${store.versions.find((v) => v.id === store.active).name}”.`);
    });
    $('remove').addEventListener('click', async () => {
      const id = $('versions').value;
      if (id === 'original') return say('The original stays.');
      if (id === store.active) return say('That version is on the cover. Put another on the cover first.');
      store.versions = store.versions.filter((v) => v.id !== id); list();
      await write('Deleted.');
    });
    $('reset').addEventListener('click', () => { config = { ...Dissolve.DEFAULTS }; show(); say('Faders reset. Nothing is saved until you press Save.'); });
    list();
  </script>
</body>
</html>
