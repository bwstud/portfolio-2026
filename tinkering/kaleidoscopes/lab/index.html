<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kaleidoscope Lab · Brian Studwell</title>
  <meta name="description" content="Design new kaleidoscopes: choose the mirrors, what they reflect, how it moves, and the glass it's seen through.">
  <style>
    @font-face {
      font-family: "Geist";
      font-weight: 100 900;
      font-display: swap;
      src: url("../../../fonts/Geist-Variable.woff2") format("woff2");
    }

    :root {
      --bg: #0b0b0b;
      --panel: #121212;
      --raise: #181818;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.16);
      --fg: #f0eef0;
      --soft: #c7c7c7;
      --muted: #8d8d8d;
      --faint: #646464;
      --accent: #bebebe;
      --accent-ink: #141414;
      --changed: #b5b5b5;
      --bad: #a2a2a2;
      --good: #c1c1c1;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--fg); overflow: hidden;
      font: 13px/1.45 "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      display: grid; grid-template-rows: auto 1fr;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; background: none; border: 0; }
    button:disabled { cursor: default; opacity: 0.4; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none !important; }
    a { color: inherit; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 6px 11px; border-radius: 8px;
      border: 1px solid var(--line-strong); background: var(--raise); white-space: nowrap; text-decoration: none;
    }
    .btn:hover:not(:disabled) { border-color: rgba(255, 255, 255, 0.3); }
    .btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 620; }
    .btn--primary:hover:not(:disabled) { filter: brightness(1.06); border-color: var(--accent); }
    .btn--quiet { background: none; border-color: transparent; color: var(--muted); }
    .btn--quiet:hover:not(:disabled) { color: var(--fg); border-color: var(--line-strong); }
    .btn--danger:hover:not(:disabled) { color: var(--bad); border-color: var(--bad); }
    .btn svg { width: 14px; height: 14px; }

    /* ---------- header ---------- */
    .top {
      display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-width: 0;
    }
    .back { color: var(--muted); text-decoration: none; white-space: nowrap; }
    .back:hover { color: var(--fg); }
    .brand { font-size: 15px; font-weight: 650; white-space: nowrap; }
    .mode { color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .mode::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .mode.is-project::before { background: var(--good); }
    .top__end { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

    /* ---------- layout ---------- */
    .lab { display: grid; grid-template-columns: 236px minmax(0, 1fr) 330px; min-height: 0; }
    .col { min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.18) transparent; }
    .col--list { border-right: 1px solid var(--line); padding: 12px 10px; display: grid; align-content: start; gap: 14px; }
    .col--edit { border-left: 1px solid var(--line); padding: 12px 14px 90px; }

    .group__title { font-size: 12px; font-weight: 620; color: var(--soft); padding: 0 6px 6px; display: flex; justify-content: space-between; align-items: baseline; }
    .group__title small { font-weight: 400; color: var(--faint); font-size: 11px; }
    .group__empty { color: var(--faint); font-size: 12px; padding: 2px 6px; }
    .item {
      display: grid; grid-template-columns: 36px 1fr auto; gap: 9px; align-items: center; width: 100%;
      padding: 5px 6px; border-radius: 8px; text-align: left; color: var(--soft);
    }
    .item:hover { background: rgba(255, 255, 255, 0.04); color: var(--fg); }
    .item[aria-current="true"] { background: rgba(190, 190, 190, 0.1); color: var(--fg); box-shadow: inset 0 0 0 1px rgba(190, 190, 190, 0.45); }
    .item canvas { width: 36px; height: 36px; border-radius: 50%; background: #1a1a1a; display: block; }
    .item__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--changed); }
    .list-actions { display: flex; gap: 6px; padding: 0 4px; }
    .list-actions .btn { flex: 1; }

    /* ---------- preview ---------- */
    .stage { position: relative; min-height: 0; display: grid; grid-template-rows: 1fr auto; }
    .view { position: relative; min-height: 0; }
    #preview { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    #preview.is-dragging { cursor: grabbing; }
    .cell-inset {
      position: absolute; left: 12px; bottom: 12px; padding: 8px; border-radius: 10px;
      background: rgba(12, 12, 12, 0.82); border: 1px solid var(--line-strong);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      display: grid; gap: 6px; pointer-events: none;
    }
    .cell-inset canvas { display: block; border-radius: 4px; }
    .cell-inset__label { font-size: 11px; color: var(--muted); }
    .view-tools { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .view-tools .btn { background: rgba(12, 12, 12, 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .view-tools .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }

    .pics { border-top: 1px solid var(--line); padding: 8px 12px; display: flex; gap: 6px; overflow-x: auto; align-items: center; }
    .pics__label { color: var(--soft); font-weight: 620; font-size: 12px; margin-right: 4px; white-space: nowrap; }
    .pic { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 7px; overflow: hidden; border: 2px solid transparent; padding: 0; background: #1a1a1a; }
    .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .pic[aria-pressed="true"] { border-color: var(--accent); }
    .pic--add { display: grid; place-items: center; border: 1px dashed var(--line-strong); color: var(--soft); }
    .pic--add svg { width: 18px; height: 18px; }

    /* ---------- editor ---------- */
    .meta { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .meta label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
    .meta input, .meta textarea {
      width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raise);
    }
    .meta textarea { resize: vertical; min-height: 44px; }
    .meta__origin { font-size: 12px; color: var(--muted); }

    .section { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .section__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
    .section__title { font-size: 13px; font-weight: 650; }
    .section__reset { margin-left: auto; font-size: 11.5px; color: var(--muted); }
    .section__reset:hover { color: var(--fg); }
    .section__note { color: var(--muted); font-size: 12px; margin-bottom: 6px; }

    .field { padding: 6px 0; }
    .field__top { display: flex; align-items: baseline; gap: 6px; }
    .field__label { color: var(--soft); }
    .field.is-changed .field__label::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--changed); margin-left: 6px; vertical-align: 2px; }
    .field__value { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
    .field__num { width: 64px; padding: 1px 4px; text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--fg); background: var(--raise); border: 1px solid var(--line-strong); border-radius: 5px; }   /* type a value in place of dragging */
    .field__undo { color: var(--faint); font-size: 11.5px; padding: 0 2px; }
    .field__undo:hover { color: var(--fg); }
    .field__help { color: var(--faint); font-size: 11.5px; margin-top: 2px; }
    .field input[type="range"] { width: 100%; accent-color: var(--accent); margin-top: 4px; }
    .field select {
      width: 100%; margin-top: 4px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raise);
    }
    .field input[type="color"] { margin-left: auto; width: 44px; height: 26px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--raise); padding: 2px; }

    .savebar {
      position: fixed; right: 0; bottom: 0; width: 330px; padding: 10px 14px; display: flex; gap: 6px; flex-wrap: wrap;
      background: rgba(11, 11, 11, 0.94); border-top: 1px solid var(--line); border-left: 1px solid var(--line);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    }
    .savebar__status { width: 100%; font-size: 12px; color: var(--muted); }
    .savebar__status.is-changed { color: var(--changed); }

    .toast {
      position: fixed; z-index: 4; left: 50%; top: 56px; transform: translateX(-50%);
      padding: 8px 14px; border-radius: 10px; max-width: min(520px, calc(100vw - 32px));
      background: var(--raise); border: 1px solid var(--line-strong); color: var(--soft); text-align: center;
      opacity: 0; transition: opacity 0.2s; pointer-events: none;
    }
    .toast.is-shown { opacity: 1; }
    .toast.is-bad { color: var(--bad); }

    @media (max-width: 1000px) {
      body { overflow: auto; display: block; }
      .lab { display: block; }
      .col { overflow: visible; }
      .col--list { border-right: 0; border-bottom: 1px solid var(--line); }
      .stage { height: 70vh; }
      .col--edit { border-left: 0; }
      .savebar { width: 100%; left: 0; border-left: 0; }
      .top { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="back" href="../">← Kaleidoscopes</a>
    <span class="brand">Kaleidoscope Lab</span>
    <span class="mode" id="mode">Checking where saves go…</span>
    <div class="top__end">
      <a class="btn" id="open" href="../">Open in Kaleidoscopes</a>
      <button class="btn" id="share" type="button">Copy link</button>
      <button class="btn" id="export" type="button">Export</button>
      <button class="btn" id="import" type="button">Import</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
    </div>
  </header>

  <main class="lab">
    <nav class="col col--list" aria-label="Configurations">
      <div class="list-actions">
        <button class="btn" id="new" type="button">New</button>
        <button class="btn" id="duplicate" type="button">Duplicate</button>
      </div>
      <div id="groups"></div>
    </nav>

    <section class="stage" aria-label="Preview">
      <div class="view">
        <canvas id="preview" aria-label="Preview. Drag to move the picture under the mirrors."></canvas>
        <div class="view-tools">
          <button class="btn" id="motion" type="button" aria-pressed="true">Motion on</button>
          <button class="btn" id="restart" type="button" title="Back to the start of the motion">Restart</button>
          <button class="btn" id="cell-toggle" type="button" aria-pressed="true">Object cell</button>
        </div>
        <div class="cell-inset" id="cell-inset">
          <canvas id="cell"></canvas>
          <span class="cell-inset__label">What the mirrors see</span>
        </div>
      </div>
      <div class="pics" id="pics">
        <span class="pics__label">Test with</span>
        <button class="pic pic--add" id="add" type="button" title="Use your own photo or video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <input type="file" id="file" accept="image/*,video/*" hidden>
      </div>
    </section>

    <aside class="col col--edit" aria-label="Settings">
      <div class="meta">
        <span class="meta__origin" id="origin"></span>
        <label>Name <input id="name" maxlength="60" autocomplete="off"></label>
        <label>Description <textarea id="about" maxlength="200" rows="2"></textarea></label>
      </div>
      <div id="sections"></div>
    </aside>
  </main>

  <div class="savebar">
    <span class="savebar__status" id="status"></span>
    <button class="btn btn--primary" id="save" type="button">Save</button>
    <button class="btn" id="save-new" type="button">Save as new</button>
    <button class="btn btn--quiet" id="revert" type="button">Undo changes</button>
    <button class="btn btn--quiet btn--danger" id="delete" type="button">Delete</button>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="lab.js"></script>
</body>
</html>
