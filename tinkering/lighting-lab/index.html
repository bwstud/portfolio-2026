<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lighting lab</title>
  <meta name="description" content="A playground for learning how light works in 3D, from inverse-square falloff to path tracing.">
  <style>
    @font-face { font-family: "Söhne"; font-display: swap; src: url("../../fonts/soehne-buch.woff2") format("woff2"); }
    @font-face { font-family: "Söhne Breit"; font-display: swap; src: url("../../fonts/soehne-breit-halbfett.woff2") format("woff2"); }
    @font-face { font-family: "Söhne Mono"; font-display: swap; src: url("../../fonts/soehne-mono-buch.woff2") format("woff2"); }
    :root {
      --bg: #0d0e10; --panel: #15171a; --panel-2: #1c1f23; --line: #2a2e34; --line-2: #3a3f47;
      --ink: #e9e6df; --ink-2: #a7a59f; --ink-3: #6f6e6a;
      --warm: #ffb45e; --warm-2: #ffd9a8; --cool: #8fc4ff; --good: #8fd6a2;
      --sans: "Söhne", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      --display: "Söhne Breit", var(--sans);
      --mono: "Söhne Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { font: 14px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--warm-2); }

    .app { display: grid; grid-template-columns: 232px 1fr 392px; height: 100dvh; }

    /* lesson list */
    .nav { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
    .nav header { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
    .nav header a.back { font-size: 12px; color: var(--ink-3); text-decoration: none; }
    .nav header a.back:hover { color: var(--ink-2); }
    .nav h1 { font: 17px/1.2 var(--display); margin: 8px 0 2px; letter-spacing: .01em; }
    .nav header p { margin: 0; font-size: 12px; color: var(--ink-3); }
    .nav ol { list-style: none; margin: 0; padding: 8px; overflow: auto; flex: 1; }
    .nav li a { display: grid; grid-template-columns: 26px 1fr 14px; align-items: baseline; gap: 4px; padding: 8px 10px; border-radius: 7px; text-decoration: none; color: var(--ink-2); }
    .nav li a:hover { background: var(--panel-2); color: var(--ink); }
    .nav li a[aria-current="page"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--warm); }
    .nav .num { font: 11px var(--mono); color: var(--ink-3); }
    .nav .t { font-size: 13.5px; line-height: 1.3; }
    .nav .t small { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 1px; }
    .nav .done { color: var(--good); font-size: 12px; visibility: hidden; }
    .nav li a.is-done .done { visibility: visible; }
    .nav .part { font-size: 11px; color: var(--ink-3); padding: 14px 10px 4px; }
    .nav footer { padding: 12px 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-3); }

    /* viewport */
    .stage { position: relative; min-width: 0; min-height: 0; background: #000; }
    .stage canvas.view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    .readout { position: absolute; left: 14px; top: 14px; max-width: min(460px, calc(100% - 28px)); background: rgba(10,11,13,.78); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.08); border-radius: 9px; padding: 10px 12px; font: 12px/1.55 var(--mono); color: var(--ink); pointer-events: none; }
    .readout:empty { display: none; }
    .readout .k { color: var(--ink-3); }
    .readout .v { color: var(--warm-2); }
    .readout .eq { color: var(--cool); }
    .readout hr { border: 0; border-top: 1px solid rgba(255,255,255,.08); margin: 6px 0; }
    .legend { display: flex; height: 8px; border-radius: 3px; overflow: hidden; margin: 6px 0 2px; }
    .legend-l { display: flex; justify-content: space-between; color: var(--ink-3); font-size: 10.5px; }
    .badge { position: absolute; right: 14px; top: 14px; font: 12px var(--mono); background: rgba(10,11,13,.78); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 5px 11px; color: var(--ink-2); pointer-events: none; }
    .badge:empty { display: none; }
    .split { position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(255,255,255,.75); cursor: ew-resize; touch-action: none; display: none; }
    .split::after { content: ""; position: absolute; top: 50%; left: -11px; width: 24px; height: 24px; margin-top: -12px; border-radius: 50%; background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.5); }
    .split-labels { position: absolute; bottom: 14px; left: 14px; right: 14px; display: none; justify-content: space-between; font: 12px var(--mono); pointer-events: none; }
    .split-labels span { background: rgba(10,11,13,.78); padding: 4px 9px; border-radius: 6px; }
    .hint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--ink-2); background: rgba(10,11,13,.7); padding: 5px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; }
    .hint:empty { display: none; }
    .drop { position: absolute; inset: 14px; border: 2px dashed var(--warm); border-radius: 14px; display: none; align-items: center; justify-content: center; background: rgba(13,14,16,.6); font-size: 16px; color: var(--warm-2); pointer-events: none; }
    .stage.dragging .drop { display: flex; }
    .err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; color: var(--ink-2); }

    /* tutor panel */
    .side { border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
    .side .scroll { overflow: auto; flex: 1; min-height: 0; padding: 22px 22px 40px; }
    .kicker { font: 11.5px var(--mono); color: var(--warm); margin: 0 0 6px; }
    .side h2 { font: 22px/1.2 var(--display); margin: 0 0 12px; letter-spacing: .005em; }
    .side h3 { font-size: 13px; font-weight: normal; color: var(--ink-2); margin: 26px 0 10px; display: flex; align-items: center; gap: 8px; }
    .side h3::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .lesson p { margin: 0 0 11px; color: #d7d4cd; }
    .lesson p strong { color: var(--ink); font-weight: normal; border-bottom: 1px solid var(--line-2); }
    .lesson .formula { font: 13px/1.6 var(--mono); color: var(--cool); background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; margin: 4px 0 13px; overflow-x: auto; white-space: nowrap; }
    .lesson .aside { font-size: 13px; color: var(--ink-2); border-left: 2px solid var(--line-2); padding-left: 12px; margin: 0 0 12px; }
    .lesson code, .tasks code, .qs code { font: 12.5px var(--mono); background: var(--panel-2); padding: 1px 5px; border-radius: 4px; color: var(--warm-2); }

    .controls { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
    .controls > * { min-width: 0; }
    .ctl { display: grid; gap: 5px; }
    .ctl .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .ctl label { font-size: 13px; color: var(--ink); }
    .ctl output { font: 12px var(--mono); color: var(--warm-2); white-space: nowrap; }
    .ctl .help { font-size: 12px; color: var(--ink-3); line-height: 1.4; }
    .ctl input[type=range] { width: 100%; accent-color: var(--warm); margin: 2px 0; }
    .ctl select { width: 100%; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 6px 8px; }
    .ctl.toggle { grid-template-columns: 1fr auto; align-items: center; }
    .ctl.toggle .help { grid-column: 1 / -1; }
    .switch { appearance: none; width: 34px; height: 20px; border-radius: 999px; background: var(--line-2); position: relative; cursor: pointer; margin: 0; transition: background .15s; }
    .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
    .switch:checked { background: var(--warm); }
    .switch:checked::after { transform: translateX(14px); background: #1a1206; }
    .seg { display: flex; flex-wrap: wrap; gap: 4px; }
    .seg button { flex: 1 1 auto; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 7px; padding: 5px 9px; font-size: 12.5px; cursor: pointer; color: var(--ink-2); }
    .seg button[aria-pressed="true"] { background: var(--warm); border-color: var(--warm); color: #1a1206; }
    .ctl input[type=color] { width: 100%; height: 28px; border: 1px solid var(--line-2); border-radius: 7px; background: var(--panel-2); padding: 2px; }
    .btn { background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 13px; }
    .btn:hover { border-color: var(--ink-3); }
    .btn.primary { background: var(--warm); border-color: var(--warm); color: #1a1206; }
    .btnrow { display: flex; flex-wrap: wrap; gap: 6px; }
    .group-label { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

    .tasks { margin: 0; padding: 0 0 0 0; list-style: none; counter-reset: t; display: grid; gap: 9px; }
    .tasks li { counter-increment: t; display: grid; grid-template-columns: 22px 1fr; gap: 4px; font-size: 13.5px; color: #d7d4cd; }
    .tasks li::before { content: counter(t); font: 11px var(--mono); color: var(--ink-3); padding-top: 3px; }
    .qs { display: grid; gap: 8px; }
    .qs details { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; }
    .qs summary { cursor: pointer; font-size: 13.5px; list-style: none; }
    .qs summary::-webkit-details-marker { display: none; }
    .qs summary::before { content: "+"; font-family: var(--mono); color: var(--warm); margin-right: 8px; }
    .qs details[open] summary::before { content: "–"; }
    .qs details p { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); }
    .ask { font-size: 13px; color: var(--ink-2); }
    .ask li { margin-bottom: 5px; }
    .notes textarea { width: 100%; min-height: 90px; resize: vertical; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; font-size: 13px; line-height: 1.5; }
    .side .foot { border-top: 1px solid var(--line); padding: 12px 22px; display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; }
    .side .foot label { font-size: 12.5px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; cursor: pointer; white-space: nowrap; }
    .side .foot .btnrow { margin-left: auto; flex-wrap: nowrap; }
    .side .foot .btn { white-space: nowrap; }
    pre.code { font: 11.5px/1.5 var(--mono); background: #0b0c0e; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; overflow: auto; max-height: 420px; color: #cfd3d8; white-space: pre; }
    pre.code .c { color: #7d8590; }

    @media (max-width: 1100px) { .app { grid-template-columns: 200px 1fr 340px; } }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .app { display: flex; flex-direction: column; height: auto; min-height: 100dvh; }
      .nav { border-right: 0; border-bottom: 1px solid var(--line); }
      .nav header { padding: 14px 16px 10px; }
      .nav ol { display: flex; overflow-x: auto; padding: 6px 10px 10px; gap: 2px; flex: none; }
      .nav li { flex: none; }
      .nav li a { grid-template-columns: auto auto; padding: 6px 10px; }
      .nav .t small, .nav .done, .nav .part, .nav footer { display: none; }
      .stage { height: 56vh; flex: none; position: sticky; top: 0; z-index: 2; }
      .side { border-left: 0; }
      .side .scroll { overflow: visible; padding: 18px 16px 30px; }
      .side .foot { padding: 12px 16px; }
      .readout { font-size: 11px; padding: 8px 10px; left: 10px; top: 10px; max-width: calc(100% - 20px); }
      .badge { top: auto; bottom: 10px; right: 10px; font-size: 11px; }
      .hint { bottom: 44px; font-size: 11.5px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
      "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
      "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.16/src/index.js",
      "three-gpu-pathtracer": "https://cdn.jsdelivr.net/npm/three-gpu-pathtracer@0.0.27/src/index.js"
    }
  }
  </script>
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Lessons">
      <header>
        <a class="back" href="../">← Rigs and jigs</a>
        <h1>Lighting lab</h1>
        <p>From one bulb to path tracing</p>
      </header>
      <ol id="lessons"></ol>
      <footer>three.js 0.186 · three-gpu-pathtracer</footer>
    </nav>

    <main class="stage" id="stage">
      <canvas class="view" id="view"></canvas>
      <div class="readout" id="readout"></div>
      <div class="badge" id="badge"></div>
      <div class="split" id="split"></div>
      <div class="split-labels" id="splitLabels"><span></span><span></span></div>
      <div class="hint" id="hint"></div>
      <div class="drop">Drop a .glb or .gltf to load it</div>
      <div class="err" id="err"></div>
    </main>

    <aside class="side">
      <div class="scroll" id="side"></div>
      <div class="foot">
        <label><input type="checkbox" class="switch" id="doneBox"> I've got this one</label>
        <span id="pager" class="btnrow"></span>
      </div>
    </aside>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
