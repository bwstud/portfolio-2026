<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Old Glory · Brian Studwell</title>
  <style>
    @layer base, matte;
    @import url("../../matte.css") layer(matte);   /* the Matte system, under this page's own layout rules */
    @import url("../rig.css") layer(matte);        /* and what the rigs share on top of it */
    @import url("../rig-gui.css");                  /* lil-gui worn as Matte: outside the layer, as lil-gui's own styles are */
    @font-face {
      font-family: "Geist";
      font-weight: 100 900;
      font-display: swap;
      src: url("../../fonts/Geist-Variable.woff2") format("woff2");
    }

    :root {
      --bg: #050505;
      --fg: #f4f4f4;
      --muted: #909090;
      --accent: #949494;
    }

    @layer base { * { box-sizing: border-box; margin: 0; padding: 0; } }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #scene {
      position: fixed;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }
    #scene:active { cursor: grabbing; }

    .hud {
      position: fixed;
      z-index: 2;
      pointer-events: none;
      font-size: 13px;
      color: var(--muted);
    }

    .hud a { pointer-events: auto; }                       /* the way back is a Matte legend */

    .hud--top { top: 24px; left: 28px; }
    .hud--bottom { bottom: 24px; left: 28px; line-height: 1.6; max-width: 46ch; }
    .hud__title { color: var(--fg); font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }

    /* Control panel (lil-gui), docked right. Its finish is Matte, from rig-gui.css */
    body .lil-gui.root {
      --width: 300px;
      top: 16px;
      right: 16px;
      max-height: calc(100vh - 32px);
      overflow: hidden auto;
      cursor: auto;
    }

    @media (max-width: 700px) {
      .lil-gui.root { --width: 260px; }
      .hud--top { left: 16px; }
      .hud--bottom { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.20.0/dist/lil-gui.esm.min.js"
      }
    }
  </script>
</head>
<body class="matte">
  <canvas id="scene" aria-label="Night-time drone show: about a thousand lights forming a waving American flag"></canvas>

  <div class="hud hud--top"><a class="m-legend" href="../">← Experiments</a></div>
  <div class="hud hud--bottom">
    <div class="hud__title">Old Glory</div>
    A drone show of Americana. Scene 1: the American flag.
    Drag to orbit, scroll to zoom.
  </div>

  <script type="module" src="oldglory.js"></script>
</body>
</html>
