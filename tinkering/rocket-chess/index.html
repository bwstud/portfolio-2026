<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rocket Chess · Brian Studwell</title>
  <style>
    @layer base, matte;
    @import url("../../matte.css") layer(matte);   /* the Matte system, under this page's own layout rules */
    @import url("../rig.css") layer(matte);        /* and what the rigs share on top of it */
    @font-face {
      font-family: "Geist";
      font-weight: 100 900;
      font-display: swap;
      src: url("../../fonts/Geist-Variable.woff2") format("woff2");
    }

    :root {
      --bg: #0d0d0d;
      --panel: rgba(17, 17, 17, 0.84);
      --panel-solid: #161616;
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.18);
      --fg: #f0f0f0;
      --muted: #929292;
      --faint: #626262;
      --accent: #b5b5b5;
      --accent-ink: #131313;
    }

    @layer base {
      * { box-sizing: border-box; margin: 0; padding: 0; }
      button, input, select { font: inherit; color: inherit; }
      button { cursor: pointer; background: none; border: 0; }
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font: 13px/1.45 "Geist", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }


    #scene {
      position: fixed; inset: 0; display: block; width: 100%; height: 100%;
      cursor: grab; touch-action: none;
    }
    #scene:active { cursor: grabbing; }

    .panel { position: fixed; z-index: 2; border-radius: 12px; }   /* a Matte body (.m-body); its labels are Matte legends */

    /* ---------- header ---------- */
    .top {
      position: fixed; z-index: 3; top: 14px; left: 16px; right: 16px;
      display: flex; align-items: center; gap: 14px; pointer-events: none;
    }
    .top > * { pointer-events: auto; }
    .brand { font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
    .brand span { color: var(--muted); font-weight: 450; margin-left: 6px; }
    .drawer-toggle { display: none; margin-left: auto; }   /* a Matte key */
    .drawer-toggle + .drawer-toggle { margin-left: 0; }

    /* ---------- library (left) ---------- */
    .library {
      top: 50px; left: 16px; bottom: 16px; width: 272px;
      display: flex; flex-direction: column; overflow: hidden;
    }
    .library__scroll { overflow-y: auto; padding: 12px 10px 14px; }
    .group + .group { margin-top: 14px; }
    .group .label { padding: 0 8px 6px; }
    .knot { display: block; width: 100%; text-align: left; padding: 8px 10px; }   /* a row in a Matte list: the chosen one carries a signal mark */
    .knot__name { display: block; font-weight: 560; color: var(--m-print-hi); }
    .knot__sum { display: block; color: var(--m-print-dim); font-size: 12px; margin-top: 1px; }

    .about { border-top: 1px solid var(--m-well); box-shadow: 0 1px 0 rgb(255 255 255 / 0.055) inset; padding: 12px 18px 16px; max-height: 42%; overflow-y: auto; flex: none; }
    .about__head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .about__name { font-size: 14px; font-weight: 620; }
    .about__abok { color: var(--faint); font-size: 11px; white-space: nowrap; }
    .about p { color: #c8c8c8; }
    .about p + p { margin-top: 7px; }
    .about .caution { color: var(--muted); }
    .about strong { color: var(--fg); font-weight: 560; }

    /* ---------- options (right) ---------- */
    .options {
      top: 50px; right: 16px; width: 264px; max-height: calc(100% - 66px);
      overflow-y: auto; padding: 14px 16px 16px;
    }
    .opt + .opt { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--m-well); box-shadow: 0 1px 0 rgb(255 255 255 / 0.055) inset; }   /* a seam between groups */
    .opt .label { margin-bottom: 10px; display: flex; justify-content: space-between; }
    .opt .label output { color: var(--m-lit); letter-spacing: 0.02em; text-transform: none; }

    .materials { display: grid; gap: 4px; }
    .material { padding: 6px 8px; }                              /* a row in a Matte list */
    .material canvas { width: 34px; height: 18px; border-radius: 9px; flex: none; box-shadow: 0 0 0 1px var(--m-edge); }
    .material b { display: block; font-weight: 540; color: var(--m-print-hi); }
    .material small { display: block; color: var(--m-print-dim); font-size: 11.5px; line-height: 1.3; }

    .swatches { display: flex; flex-wrap: wrap; gap: 9px; }      /* colours set in the body (.m-dot); the one in use is ringed */
    .swatch { width: 24px; height: 24px; cursor: pointer; }
    .swatch--custom {
      position: relative; overflow: hidden;
      background: conic-gradient(#f55, #fd5, #5d5, #5df, #55f, #f5f, #f55);
    }
    .swatch--custom input { position: absolute; inset: -6px; opacity: 0; cursor: pointer; width: 40px; height: 40px; }
    .sub { margin-top: 12px; color: var(--m-print-dim); font-size: 11.5px; margin-bottom: 8px; }
    .is-dim { opacity: 0.45; }

    .m-fader { width: 100%; }
    .range-ends { display: flex; justify-content: space-between; color: var(--m-print-dim); font-size: 11px; margin-top: 2px; }

    .views { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .btn { min-width: 0; padding: 0 4px; }                       /* a Matte key */
    .toggles { margin-top: 12px; display: grid; gap: 9px; justify-items: start; }   /* Matte tick boxes */
    .toggles .dim { color: var(--m-print-dim); }
    .hint { margin-top: 10px; color: var(--m-print-dim); font-size: 11.5px; }

    /* ---------- step card and transport (bottom) ---------- */
    .stage {
      left: 50%; transform: translateX(-50%); bottom: 16px;
      width: min(600px, calc(100% - 600px)); min-width: 380px;
      padding: 14px 16px 12px;
    }
    .step__meta { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
    .step__count { color: var(--m-signal); }                     /* a Matte legend in the signal colour */
    .step__time { color: var(--m-print-dim); }
    .step__title { font-size: 16px; font-weight: 620; margin-top: 3px; }
    .step__text { color: #cccccc; margin-top: 4px; min-height: 3em; }

    .steps { display: flex; gap: 4px; margin: 12px 0 10px; }
    .steps button {
      flex: 1; height: 16px; padding: 6px 0; background-clip: content-box;
      background-color: var(--m-meter-off); border-radius: 0;   /* the steps as a Matte meter: segments that light as they play */
      position: relative;
    }
    .steps button::after {
      content: ""; position: absolute; left: 0; top: 6px; bottom: 6px;
      width: var(--fill, 0%); background: var(--m-meter-on);
    }
    .steps button:hover { background-color: color-mix(in srgb, var(--m-print) 40%, var(--m-meter-off)); }

    .transport { display: flex; align-items: center; gap: 8px; }
    .tbtn { width: 38px; min-width: 0; padding: 0; }             /* Matte keys; Play is the primary */
    .tbtn svg { width: 14px; height: 14px; }
    .tbtn--play { width: 48px; }
    .speed { margin-left: auto; display: flex; align-items: center; gap: 10px; }
    .speed .seg button { padding: 0 8px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
    .busy { color: var(--m-signal); font-size: 12px; margin-left: 6px; }

    .no-ui .panel, .no-ui .top { display: none !important; }

    @media (max-width: 1100px) {
      .stage { width: calc(100% - 600px); min-width: 0; }
    }

    @media (max-width: 900px) {
      .drawer-toggle { display: inline-block; }
      .library, .options {
        top: 52px; bottom: auto; max-height: calc(100% - 290px);
        width: min(300px, calc(100% - 32px)); display: none;
      }
      .library.is-open { display: flex; }
      .options.is-open { display: block; }
      .about { max-height: 160px; }
      .stage { left: 16px; right: 16px; transform: none; width: auto; min-width: 0; }
      .speed > span { display: none; }
      .brand span { display: none; }
      .top { gap: 10px; }
      .transport { gap: 5px; }
      .tbtn { width: 34px; }
      .tbtn--play { width: 42px; }
      .speed .seg button { padding: 0 5px; }
      .step__title { font-size: 15px; }
      .step__text { min-height: 0; }
    }

    .piece { display:block; width:100%; text-align:left; padding:7px 10px; }   /* a row in a Matte list: the chosen one carries a signal mark */
    .piece__role { display:block; margin-bottom: 3px; color: var(--m-print-dim); }   /* a Matte legend */
    .piece__name { display:block; font-weight:560; color: var(--m-print-hi); }
    .piece__sum { display:block; color: var(--m-print-dim); font-size:12px; }
    #pieces { margin-top: 14px; }
    .about__flag { color: var(--faint); font-size: 11px; }
    .specs { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:4px 0 8px; font-size:12px; }
    .specs dt { color: var(--muted); } .specs dd { margin:0; font-variant-numeric: tabular-nums; }
    .seg2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; }   /* pairs of Matte keys; the one in use stays down */
    .seg2 .btn { font-size: 9px; letter-spacing: 0.06em; white-space: nowrap; }
    #labels { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
    .tag { text-align:center; color: var(--fg); font-size:11.5px; line-height:1.3; white-space:nowrap; }
    .tag b { display:block; font-weight:600; } .tag span { color: var(--muted); font-size:10.5px; }
    .tick { color: var(--muted); font-size:10.5px; transform: translateX(-60%); white-space:nowrap; }
    @media (max-width: 600px) {
      .tag { width: 50px; font-size:10px; white-space:normal; } .tag span { font-size:9px; }
      .tick { font-size:9px; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body class="matte">
  <canvas id="scene" aria-label="3D chess set made of scale-model spacecraft"></canvas>
  <div id="labels"></div>
  <header class="top">
    <a class="back m-legend" href="../">← Rigs and Jigs</a>
    <span class="brand">Rocket Chess <span>Real craft · 1:1250</span></span>
    <button class="drawer-toggle m-key" id="library-toggle" type="button">Pieces</button>
    <button class="drawer-toggle m-key" id="options-toggle" type="button">Options</button>
  </header>

  <aside class="panel library m-body" id="library" aria-label="Pieces">
    <div class="library__scroll">
      <div class="group">
        <div class="label m-legend">Set</div>
        <div class="seg2">
          <button class="btn m-key" type="button" aria-pressed="true">Real craft</button>
          <button class="btn m-key" type="button" disabled title="Coming soon">Fictional · soon</button>
        </div>
      </div>
      <div id="pieces"></div>
    </div>
    <div class="about" id="about"></div>
  </aside>

  <aside class="panel options m-body" id="options" aria-label="View options">
    <div class="opt">
      <div class="label m-legend">View</div>
      <div class="seg2">
        <button class="btn m-key" type="button" data-view="board">Board</button>
        <button class="btn m-key" type="button" data-view="lineup">Size lineup</button>
      </div>
    </div>
    <div class="opt" id="scale-opt">
      <div class="label m-legend">Scale</div>
      <div class="seg2">
        <button class="btn m-key" type="button" data-scale="true">True 1:1250</button>
        <button class="btn m-key" type="button" data-scale="tournament">Tournament</button>
      </div>
      <p class="hint">True scale keeps every rocket's real height. Tournament stretches each one to standard Staunton heights.</p>
    </div>
    <div class="opt">
      <div class="label m-legend">Finish</div>
      <div class="seg2">
        <button class="btn m-key" type="button" data-finish="livery">Flight livery</button>
        <button class="btn m-key" type="button" data-finish="mono">Ivory / graphite</button>
      </div>
      <div class="toggles">
        <label class="m-check"><input type="checkbox" id="spin"> Turntable</label>
      </div>
    </div>
    <div class="opt">
      <div class="label m-legend">Tools</div>
      <div class="seg2">
        <button class="btn m-key" type="button" id="reset">Reset camera</button>
        <button class="btn m-key" type="button" id="stl">Export STL</button>
      </div>
      <p class="hint">Drag to orbit, scroll to zoom. Click any piece to inspect it.</p>
    </div>
  </aside>

  <script type="module" src="rocketchess.js"></script>
</body>
</html>
