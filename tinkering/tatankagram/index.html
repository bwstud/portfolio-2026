<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tatankagram</title>
  <meta name="description" content="Thirty thousand beads rise out of a ring of dust and settle into a bison. Turn the animal and tune the light.">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../../matte.css?v=15">
  <style>
    /* Tatankagram: a bison made of thirty thousand small metal beads. They ride a ring of dust low on the ground, rise
       into the animal from the hooves up, hold, and are blown off by the wind, left to right, back into the ring.
       The points come from the 3DRT bison model (tools/bison/tatankagram.py); tatankagram.js draws them. The stage is the canvas;
       the panel is the instrument: every fader has a typed number beside it. */
    body { margin: 0; min-height: 100vh; background: var(--c-night); color: var(--c-mist); font: 400 15px/1.5 var(--font-sans); }
    .lab { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 100vh; }
    .stage { position: sticky; top: 0; height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
    .stage__head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding: 20px 28px; }
    .stage__head h1 { margin: 0; font: 600 22px/1 var(--font-display); letter-spacing: -0.01em; }
    .stage__view { position: relative; min-height: 0; }
    .stage__view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
    .stage__view canvas.is-turning { cursor: grabbing; }
    .stage__fail { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; }
    .stage__fail[hidden] { display: none; }
    .transport { display: grid; grid-template-columns: auto auto auto minmax(0, 1fr) 68px; align-items: center; gap: 12px; padding: 16px 28px 24px; }
    .transport .m-fader { width: 100%; }
    .side { display: flex; flex-direction: column; gap: 16px; padding: 20px; background: #08090b; border-left: 1px solid rgb(255 255 255 / 0.06); overflow-y: auto; max-height: 100vh; box-sizing: border-box; }
    .side .m-panel { display: flex; }
    /* the panels the script builds sit in #groups: the same gap between them as between the rest */
    #groups { display: flex; flex-direction: column; gap: 16px; }
    /* menus and fields take the panel's width, so long names show whole and nothing pokes out of its panel */
    .side .m-cell { min-width: 0; }
    .matte .side select.m-input, .matte .side .saved__row .m-input { width: 100%; min-width: 0; box-sizing: border-box; }
    .side .saved__row .m-key { flex: none; }
    .group { display: grid; gap: 14px; justify-items: stretch; }
    .group h2 { margin: 0; }
    .keys { display: flex; flex-wrap: wrap; gap: 8px; }
    .row { display: grid; grid-template-columns: 1fr 68px; align-items: center; gap: 4px 10px; }
    .row label { grid-area: 1 / 1; align-self: end; }
    .row .m-fader { grid-area: 2 / 1; width: 100%; }
    /* every fader has a number field beside it: type a value in place of dragging */
    .matte .row__num, .matte .transport__num { grid-area: 2 / 2; width: 100%; height: 24px; padding: 0 6px; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
    .matte .transport__num { grid-area: auto; }
    /* a fader moved off where it started gets a Reset beside its name, which puts it back */
    .matte .row__reset { grid-area: 1 / 2; justify-self: end; align-self: end; height: 16px; margin-right: -5px; padding: 0 5px; border-radius: 3px; color: var(--m-signal); font: 400 9px/16px var(--m-font); letter-spacing: 0.1em; text-transform: uppercase; }
    .matte .row__reset:hover { color: var(--m-print-hi); background: color-mix(in srgb, var(--m-print) 12%, transparent); }
    .matte .row__reset[hidden] { display: none; }
    .row.is-changed .row__num { color: var(--m-signal); }
    .saved { gap: 10px; }
    .saved__row { display: flex; gap: 8px; align-items: center; }
    .saved__row .m-input { flex: 1; min-width: 0; }
    #status { min-height: 1.4em; margin: 0; }
    .ease { display: grid; gap: 8px; }
    .ease__curve { width: 100%; height: 132px; overflow: visible; }
    .ease__field { fill: rgb(255 255 255 / 0.02); stroke: rgb(255 255 255 / 0.06); stroke-width: 1; vector-effect: non-scaling-stroke; }
    .ease__rule { stroke: rgb(255 255 255 / 0.14); stroke-width: 1; stroke-dasharray: 2 3; vector-effect: non-scaling-stroke; }
    .ease__arm { stroke: var(--m-print); opacity: 0.45; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .ease__path { fill: none; stroke: var(--m-signal); stroke-width: 2; vector-effect: non-scaling-stroke; }
    .ease__dot { stroke: var(--m-print-hi); stroke-width: 7; stroke-linecap: round; vector-effect: non-scaling-stroke; }
    .swatches { display: flex; gap: 16px; }
    .swatch { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .swatch[hidden] { display: none; }
    .swatch input { width: 32px; height: 24px; padding: 0; border: 1px solid rgb(255 255 255 / 0.12); border-radius: 4px; background: none; cursor: pointer; }
    .swatch input::-webkit-color-swatch-wrapper { padding: 2px; }
    .swatch input::-webkit-color-swatch { border: 0; border-radius: 2px; }
    @media (max-width: 900px) {
      .lab { grid-template-columns: 1fr; }
      .stage { position: static; height: 82vh; }
      .side { max-height: none; border-left: 0; }
    }
  </style>
</head>
<body class="matte matte--dark">
  <div class="lab">
    <section class="stage" aria-label="Bison">
      <header class="stage__head">
        <a class="m-legend" href="../">← Experiments</a>
        <h1>Tatankagram</h1>
        <span class="m-legend m-legend--dim" id="hint">Drag to turn · Scroll to zoom</span>
      </header>
      <div class="stage__view">
        <canvas id="view" role="img" aria-label="A bison made of thousands of small metal beads, rising out of a ring of dust"></canvas>
        <p class="stage__fail m-legend m-legend--dim" id="fail" hidden>This needs WebGL 2, which this browser doesn’t offer.</p>
      </div>
      <footer class="transport">
        <button class="m-key" id="play" type="button" aria-label="Pause">Pause</button>
        <button class="m-key" id="replay" type="button">Restart</button>
        <button class="m-key m-key--primary" id="form-toggle" type="button">Form the bison</button>
        <input class="m-fader" type="range" id="clock" min="0" max="10" step="0.01" value="0" aria-label="Loop position, seconds">
        <input class="m-input transport__num" type="number" id="clock-num" min="0" max="10" step="0.01" aria-label="Loop position, seconds, typed">
      </footer>
    </section>

    <aside class="side" aria-label="Settings">
      <div class="m-panel m-panel--col m-panel--flat"><div class="m-cell group saved">
        <h2 class="m-legend m-legend--lg">Saved versions</h2>
        <select class="m-input" id="versions" aria-label="Saved version"></select>
        <div class="saved__row">
          <button class="m-key" id="use" type="button">Open with this</button>
          <button class="m-key" id="remove" type="button">Delete</button>
        </div>
        <div class="saved__row">
          <input class="m-input" id="name" type="text" placeholder="Name for a new version" aria-label="Name for a new version">
          <button class="m-key" id="save" type="button">Save</button>
        </div>
        <p class="m-legend m-legend--dim" id="status" role="status"></p>
      </div></div>
      <div class="m-panel m-panel--col m-panel--flat"><div class="m-cell group">
        <h2 class="m-legend m-legend--lg">Subject</h2>
        <div class="keys" role="group" aria-label="Subject">
          <button class="m-key" type="button" data-subject="head" aria-pressed="true"><span class="m-led" aria-hidden="true"></span>Head on</button>
          <button class="m-key" type="button" data-subject="whole" aria-pressed="false"><span class="m-led" aria-hidden="true"></span>Whole animal</button>
        </div>
        <label class="m-legend" for="form">Shape between animals</label>
        <select class="m-input" id="form"></select>
        <div class="keys">
          <button class="m-key m-key--quiet" id="take-view" type="button">Start from this view</button>
          <button class="m-key m-key--quiet" id="reset-view" type="button">Reset view</button>
          <button class="m-key m-key--quiet" id="reset-all" type="button">Reset the faders</button>
        </div>
      </div></div>
      <div class="m-panel m-panel--col m-panel--flat"><div class="m-cell group">
        <h2 class="m-legend m-legend--lg">Material and colour</h2>
        <label class="m-legend" for="material">Material</label>
        <select class="m-input" id="material"></select>
        <label class="m-legend" for="color-mode">Colour</label>
        <select class="m-input" id="color-mode"></select>
        <div class="swatches">
          <label class="swatch" id="pale-row"><input type="color" id="pale"><span class="m-legend" id="pale-label">Colour</span></label>
          <label class="swatch" id="dark-row"><input type="color" id="dark"><span class="m-legend">Dark</span></label>
        </div>
      </div></div>
      <div id="groups"></div>
    </aside>
  </div>
  <script src="versions.js"></script>   <!-- saved versions, written by the local server (tools/lab-server.mjs) -->
  <script src="tatankagram.js"></script>
</body>
</html>
