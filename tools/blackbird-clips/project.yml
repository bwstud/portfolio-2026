name: BBDriver
options: { bundleIdPrefix: local.bbdriver, deploymentTarget: { iOS: "17.0" } }
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings: { GENERATE_INFOPLIST_FILE: YES, CODE_SIGNING_ALLOWED: NO, INFOPLIST_KEY_UILaunchScreen_Generation: YES }
  Drive:
    type: bundle.ui-testing
    platform: iOS
    sources: [Drive]
    dependencies: [{ target: Host }]
    settings: { GENERATE_INFOPLIST_FILE: YES, CODE_SIGNING_ALLOWED: NO, TEST_TARGET_NAME: Host }
schemes:
  Drive:
    build: { targets: { Host: all, Drive: [test] } }
    test: { targets: [Drive] }
