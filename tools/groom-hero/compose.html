<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Groom Lake hero</title>
<!--
  The Groom Lake hero video, composed in the browser from the Paper exports in src/ (Case Studies › Groom Lake Gallery
  Assets, exported at 2x and named by frame id) and, for its second half, recordings of Mazlan at work in the prototype
  (src/ai/, made by record-ai.mjs and cut-ai.sh). Open it to watch it play; render.mjs steps it frame by frame (window.render)
  and encodes the MP4. On the site the film opens with a screen recording of the sign-in instead of scene 1: assemble.sh
  cuts the recording at the click and joins this film from 2.6 s.
  Every scene is a list of layers; each layer is a picture with keyframes (time, centre x/y on the 1920 × 1200 stage,
  scale, opacity, and how its move eases). One look holds it together: the site's off-black stage (light for the light-mode
  passages), one corner radius, one shadow, one hairline edge, and one family of curves.
-->
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 1920px; height: 1200px; overflow: hidden; background: #0c0e12; }
  /* flat stages: a gradient this dark has only a handful of 8-bit shades in it, and in video each one shows as a ring */
  #bg-light { position: absolute; inset: 0; background: #e8ebef; }
  #bg-dark { position: absolute; inset: 0; background: #0e1116; }
  .layer { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; will-change: transform, opacity; border-radius: var(--r, 14px); overflow: hidden; }
  .layer img, .layer video { display: block; width: 100%; height: auto; }
  .layer.dark { box-shadow: 0 0 0 1px rgb(255 255 255 / 0.07), 0 30px 80px rgb(0 0 0 / 0.55), 0 8px 24px rgb(0 0 0 / 0.35); }
  .layer.light { box-shadow: 0 0 0 1px rgb(20 30 50 / 0.06), 0 28px 70px rgb(20 30 50 / 0.16), 0 6px 18px rgb(20 30 50 / 0.08); }
  .layer.flat { box-shadow: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg-dark"></div>
  <div id="bg-light"></div>
  <div id="layers"></div>
</div>
<script>
const D = 30;   // seconds; it starts and ends on the empty stage, so it loops without a seam
window.D = D;   // render.mjs reads the length from here
const W = 1920, H = 1200;

// the curves: entries settle long and soft, exits leave gently, camera moves are even on both ends
const E = {
  out: p => 1 - Math.pow(1 - p, 4),
  in: p => p * p * p,
  inout: p => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  lin: p => p,
};
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const span = (t, a, b, ease = 'inout') => E[ease](clamp((t - a) / (b - a)));

// a layer: a picture (src/<id>.png), its width on the stage, a look (dark | light), and keyframes
// [t, x, y, scale, opacity, ease-into-this-key]. Before the first key and after the last it is hidden.
// A layer with { video: true } is a recording instead (src/ai/<id>.mp4, cut by cut-ai.sh), playing from its start at its
// first key; { from: s } starts it s seconds in.
const L = [];
function layer(id, w, look, keys, opts = {}) { L.push({ id, w, look, keys, ...opts }); }

// The cut has a rhythm: long, slow moves broken up by bursts of hard cuts (about half a second a shot), so no two
// stretches run the same length. A hard cut is a layer at full opacity from its first key to its last, nothing eased in
// or out; it keeps drifting while it is on, so even a short shot moves.
const cut = (id, w, look, t0, t1, a, b, opts = {}) =>
  layer(id, w, look, [[t0, a[0], a[1], a[2], 1], [t1, b[0], b[1], b[2], 1, 'lin']], opts);
const burst = (t0, len, look, shots) => shots.forEach(([id, w, a, b], i) => cut(id, w, look, t0 + i * len, t0 + (i + 1) * len, a, b, { z: 5 }));

// 1 · Sign in (0.2–2.6): the card rises out of the dark, then a hard cut to the username form in the same place
layer('1BC-0', 860, 'dark', [[0.2, 960, 660, 0.97, 0], [1.3, 960, 600, 1, 1, 'out'], [1.6, 960, 597, 1, 1, 'lin']]);
cut('1BM-0', 860, 'dark', 1.6, 2.6, [960, 597, 1], [960, 585, 1.015]);

// 2 · Burst (2.6–4.4): four close-ups of the dark product
burst(2.6, 0.45, 'dark', [
  ['1E9-0', 2000, [1200, 600, 1], [1170, 600, 1.04]],    // the assignments donut, large
  ['1GD-0', 900, [960, 760, 1], [960, 560, 1]],          // up next and activity, sliding up
  ['1VJ-0', 1800, [940, 600, 1], [980, 600, 1.05]],      // the created-items chart
  ['21O-0', 1900, [960, 600, 1], [930, 600, 1.03]],      // a record row, edge to edge
]);

// 3 · The dashboard (4.4–7.2): the one long breath, a slow lean toward the charts
cut('1L1-0', 1500, 'dark', 4.4, 7.2, [960, 600, 1], [1000, 720, 1.25]);

// 4 · Dark to light (7.2–9.6): the chart and the profile menu, then a hard match cut to the same screen in light mode
cut('1VJ-0', 1100, 'dark', 7.2, 8.4, [1130, 520, 1], [1118, 517, 1.01], { z: 1 });
cut('5C1-0', 340, 'dark', 7.2, 8.4, [430, 640, 1], [429, 628, 1.01], { z: 2 });
cut('72P-0', 1100, 'light', 8.4, 9.6, [1110, 515, 1.01], [1098, 511, 1.02], { z: 1 });
cut('7QF-0', 340, 'light', 8.4, 9.6, [428, 622, 1.01], [426, 610, 1.02], { z: 2 });

// 5 · Burst (9.6–11.4): four close-ups of the light product
burst(9.6, 0.45, 'light', [
  ['B3D-0', 1800, [960, 600, 1], [990, 600, 1.04]],      // pinned reports
  ['ASB-0', 760, [960, 660, 1], [960, 540, 1]],          // due-date bars, sliding up
  ['B93-0', 1400, [960, 600, 1], [930, 600, 1.04]],      // indicators
  ['6VR-0', 2000, [1200, 600, 1], [1170, 600, 1.04]],    // the donut in light
]);

// 6 · The cards (11.4–13.8): three columns already in motion, each at its own pace
const col = (x, top, speed, ids, t0 = 11.4, t1 = 13.8) => {
  let y = top;
  ids.forEach(([id, h]) => {
    const cy = y + h * 1.1 / 2;
    cut(id, 440, 'light', t0, t1, [x, cy + speed * 0.35, 1], [x, cy - speed * 0.65, 1]);
    y += h * 1.1 + 36;
  });
};
col(460, 280, 120, [['6Y2-0', 187], ['6YM-0', 393], ['B93-0', 252]]);
col(960, 170, 180, [['B02-0', 302], ['ASB-0', 639]]);
col(1460, 240, 90, [['70C-0', 393], ['B5O-0', 365]]);

// The second half is Mazlan at work, recorded from the prototype (record-ai.mjs, cut by cut-ai.sh): three moments, each
// a short run of hard cuts that follows one request from the asking to the result, on the dark stage.
const vcut = (id, w, t0, t1, a, b, opts = {}) => cut(id, w, 'dark', t0, t1, a, b, { video: true, ...opts });

// 7 · A filter in plain words (13.8–18.6): the sentence, Mazlan's either/or reading of it, the expression it builds in
// the filters, and the results it leaves
vcut('filter-type', 1300, 13.8, 15.0, [960, 600, 1], [960, 592, 1.02]);
vcut('filter-card', 760, 15.0, 16.3, [960, 610, 1], [960, 596, 1.02]);
vcut('filter-expr', 1500, 16.3, 17.5, [960, 600, 1], [930, 600, 1.04]);
vcut('filter-results', 1500, 17.5, 18.6, [960, 620, 1], [960, 580, 1.02]);

// 8 · An incident, spoken (18.6–23.4): the description dictated, Mazlan working out what it is, and the draft record
// opening beside the chat, already filled in
vcut('intake-voice', 1400, 18.6, 20.1, [960, 600, 1], [960, 590, 1.03]);
vcut('intake-think', 1300, 20.1, 21.1, [960, 600, 1], [975, 600, 1.02]);
vcut('intake-record', 1760, 21.1, 23.4, [960, 600, 1], [880, 620, 1.1]);

// 9 · A component, asked for (23.4–30): the request, Mazlan's quick questions, the preview, and the new component on
// the dashboard; then the stage empties for the loop
vcut('build-ask', 1300, 23.4, 24.8, [960, 600, 1], [950, 594, 1.02]);
vcut('build-plan', 820, 24.8, 26.3, [960, 600, 1], [960, 585, 1.02]);
vcut('build-preview', 560, 26.3, 27.6, [960, 620, 1], [960, 590, 1.02]);
layer('build-landed', 1700, 'dark', [[27.6, 960, 600, 1, 1], [29.0, 1120, 500, 1.12, 1, 'lin'], [29.8, 1132, 490, 1.13, 0, 'in']], { video: true });

// the stage is light, by hard cuts, from the match cut to the end of the cards
const lightAt = t => (t >= 8.4 && t < 13.8 ? 1 : 0);

// build the layers
const box = document.getElementById('layers');
const els = L.map(l => {
  const el = document.createElement('div'); el.className = 'layer ' + l.look;
  if (l.video) {
    const v = document.createElement('video'); v.src = 'src/ai/' + l.id + '.mp4'; v.muted = true; v.preload = 'auto'; v.playsInline = true;
    el.append(v); l.img = v;
  } else { const img = new Image(); img.src = 'src/' + l.id + '.png'; img.decoding = 'sync'; el.append(img); l.img = img; }
  el.style.width = l.w + 'px'; el.style.zIndex = l.z || 0;
  box.append(el); l.el = el; return el;
});
const loaded = l => l.video
  ? new Promise(r => (l.img.readyState >= 2 ? r() : l.img.addEventListener('loadeddata', r, { once: true }))).then(() => [l.img.videoWidth, l.img.videoHeight])
  : l.img.decode().then(() => [l.img.naturalWidth, l.img.naturalHeight]);
window.ready = Promise.all(L.map(l => loaded(l).then(([w, h]) => {
  l.h = l.w * h / w;
  if (l.window) { l.el.style.height = l.window + 'px'; l.h = l.window; }
})));
// a recording on show is moved to the film's time; render() resolves once every one of them shows that frame
const seek = (v, s) => new Promise(r => {
  s = Math.min(Math.max(0, s), (v.duration || 0) - 0.001);
  if (Math.abs(v.currentTime - s) < 0.0005) return r();
  // the frame is shown once it is presented; a seek that lands on the frame already showing presents nothing new, so
  // after a moment it counts as shown
  v.addEventListener('seeked', () => {
    let done = false; const fin = () => { if (!done) { done = true; r(); } };
    if (v.requestVideoFrameCallback) v.requestVideoFrameCallback(fin);
    setTimeout(fin, 120);
  }, { once: true });
  v.currentTime = s;
});

function at(l, t) {
  const k = l.keys;
  if (t < k[0][0] || t >= k[k.length - 1][0]) return null;   // the last key is exclusive, so a hard cut never shows both shots
  for (let i = 1; i < k.length; i++) {
    if (t <= k[i][0]) {
      const a = k[i - 1], b = k[i], p = E[b[5] || 'inout'](clamp((t - a[0]) / (b[0] - a[0])));
      return [1, 2, 3, 4].map(j => a[j] + (b[j] - a[j]) * p);
    }
  }
  return k[k.length - 1].slice(1, 5);
}

window.render = t => {
  t = ((t % D) + D) % D;
  const seeks = [];
  const light = lightAt(t);
  document.getElementById('bg-light').style.opacity = light;
  // a slow, constant drift of the whole camera, a few pixels, so nothing ever sits dead still
  const cam = `translate(${Math.sin(t * 0.21) * 10}px, ${Math.cos(t * 0.17) * 8}px)`;
  document.getElementById('layers').style.transform = cam;
  for (const l of L) {
    const s = at(l, t);
    if (!s || s[3] <= 0.001) { l.el.style.visibility = 'hidden'; continue; }
    const [x, y, sc, o] = s;
    l.el.style.visibility = 'visible';
    l.el.style.opacity = o;
    l.el.style.transform = `translate(${x - l.w / 2}px, ${y - l.h / 2}px) scale(${sc})`;
    if (l.scroll) { const [a, b, from, to] = l.scroll; l.img.style.transform = `translateY(${-(from + (to - from) * span(t, a, b, 'inout'))}px)`; }
    if (l.video) seeks.push(seek(l.img, (l.from || 0) + t - l.keys[0][0]));
  }
  return Promise.all(seeks);
};

// open it in a browser to watch: it plays on the page's clock (?t=12 holds a moment)
const q = new URLSearchParams(location.search);
window.ready.then(() => {
  if (q.has('render')) return;
  if (q.has('t')) return render(parseFloat(q.get('t')));
  const t0 = performance.now(); let busy = false;
  const tick = now => { if (!busy) { busy = true; render((now - t0) / 1000).then(() => (busy = false)); } requestAnimationFrame(tick); }; requestAnimationFrame(tick);
});
</script>
</body>
</html>
